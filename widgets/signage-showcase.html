<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signage Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     TenAV signage showcase widget
     Drop the <div class="tav-showcase"> block + this <style> + the
     <script> into any page. Edit SLIDES in the script to change content.
     Set `photo` on a slide to use a real store photo instead of the
     CSS-drawn scene (the screen overlay is hidden for photo slides).
     ------------------------------------------------------------------ */
  :root {
    --tav-radius: 22px;
    --tav-text: #1f2430;
    --tav-muted: #5b6170;
    --tav-up: #1f9d55;
    --tav-page: #eef0f6;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--tav-page);
    font-family: "Poppins", system-ui, sans-serif;
  }

  .tav-showcase {
    position: relative;
    width: min(520px, calc(100vw - 32px));
    aspect-ratio: 52 / 65;
    margin: 24px 16px 24px 56px;
  }
  @media (max-width: 600px) { .tav-showcase { margin: 24px 16px; } }

  .tav-frame {
    position: absolute;
    inset: 0;
    border-radius: var(--tav-radius);
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(40, 30, 10, .35);
    background: #2a1d0c;
  }

  /* ---------- CSS-drawn store scene ---------- */
  .tav-scene {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 40% 18% at 50% 0%, rgba(255,240,200,.9), transparent 70%),
      linear-gradient(180deg, #8a5a1c 0%, #c79446 18%, #d9ab5e 45%, #b9873f 72%, #6d4a1e 100%);
  }
  .tav-scene::before { /* ceiling spotlights */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle 6px at 22% 6%, #fffbe8 60%, transparent 70%),
      radial-gradient(circle 6px at 78% 6%, #fffbe8 60%, transparent 70%),
      radial-gradient(circle 5px at 40% 9%, #fff6d6 60%, transparent 70%),
      radial-gradient(circle 5px at 60% 9%, #fff6d6 60%, transparent 70%),
      radial-gradient(ellipse 18% 30% at 22% 10%, rgba(255,240,200,.35), transparent 70%),
      radial-gradient(ellipse 18% 30% at 78% 10%, rgba(255,240,200,.35), transparent 70%);
  }
  .tav-scene::after { /* floor */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16%;
    background: linear-gradient(180deg, #d8c3a0, #9c8566);
    box-shadow: 0 -2px 0 rgba(255,255,255,.25);
  }
  .tav-alcove {
    position: absolute; top: 17%; bottom: 18%; width: 23%;
    background: linear-gradient(180deg, #f4dfae, #e7c587 60%, #cfa865);
    box-shadow: inset 0 0 30px rgba(90,55,10,.45);
    border-radius: 3px;
  }
  .tav-alcove.l { left: 4%; }
  .tav-alcove.r { right: 4%; }
  .tav-alcove .shelf {
    position: absolute; left: 6%; right: 6%; height: 3px;
    background: #fff4d8; box-shadow: 0 6px 10px rgba(120,80,20,.35);
  }
  .tav-alcove .rail {
    position: absolute; left: 8%; right: 8%; top: 40%; height: 2px; background: #6b5130;
  }
  .tav-alcove .clothes {
    position: absolute; left: 10%; right: 10%; top: calc(40% + 4px); height: 34%;
    border-radius: 2px 2px 6px 6px;
    background: repeating-linear-gradient(90deg,
      #3b2a22 0 7%, #7d2f25 7% 14%, #c9643d 14% 21%, #e6c9a8 21% 28%,
      #2f3a4a 28% 35%, #b34a32 35% 42%, #8c6a52 42% 49%, #e2a07a 49% 56%);
    filter: saturate(.9);
    box-shadow: 0 8px 14px rgba(60,30,10,.4);
  }
  .tav-alcove .items {
    position: absolute; left: 14%; right: 14%; top: 15%; height: 9%;
    background:
      radial-gradient(circle at 15% 70%, #b8442c 0 18%, transparent 19%),
      radial-gradient(circle at 50% 75%, #f2ece3 0 16%, transparent 17%),
      radial-gradient(circle at 85% 70%, #c9643d 0 18%, transparent 19%);
  }
  .tav-pillar {
    position: absolute; top: 0; bottom: 16%; width: 8%;
    background: linear-gradient(90deg, #8f6224, #e7bd70 40%, #b58337);
  }
  .tav-pillar.l { left: 27%; } .tav-pillar.r { right: 27%; }

  /* ---------- the digital screen ---------- */
  .tav-screen {
    position: absolute; left: 50%; top: 22%;
    width: 41%; aspect-ratio: 9 / 16;
    transform: translateX(-50%);
    background: #15171c;
    border-radius: 4px;
    padding: 1.6% 1.4%;
    box-shadow: 0 18px 36px rgba(30,15,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  .tav-display {
    position: relative; width: 100%; height: 100%;
    overflow: hidden; border-radius: 2px;
    container-type: inline-size;
  }
  .tav-ad {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; color: #6b4f3a;
    opacity: 0; transform: scale(1.04);
    transition: opacity .7s ease, transform .9s ease;
  }
  .tav-ad.on { opacity: 1; transform: none; }
  .tav-ad .brand {
    margin-top: 7%;
    font: 600 5.5cqw/1 "Poppins", sans-serif; letter-spacing: .25em;
    padding: 3% 7%; border: 1px solid currentColor;
    background: #1f2430; color: #fff; outline: 1px solid #1f2430; outline-offset: 2px;
  }
  .tav-ad .title {
    margin-top: 7%;
    font: 600 8cqw/1.1 "Cormorant Garamond", serif; letter-spacing: .12em;
    text-transform: uppercase;
  }
  .tav-ad .sub { font-size: 4.2cqw; letter-spacing: .2em; text-transform: uppercase; opacity: .8; margin-top: 1.5%; }
  .tav-ad .product { position: relative; flex: 1; width: 82%; display: grid; place-items: center; }
  .tav-ad .product svg { width: 100%; max-height: 92%; filter: drop-shadow(0 10px 8px rgba(0,0,0,.18)); }
  .tav-ad .new {
    position: absolute; right: 2%; top: 18%;
    width: 26cqw; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center;
    background: #d0121b; color: #fff;
    font: 700 8cqw/1 "Poppins", sans-serif; font-style: italic;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    animation: tav-pulse 2.4s ease-in-out infinite;
  }
  .tav-ad .season { font-size: 3.8cqw; letter-spacing: .2em; text-transform: uppercase; opacity: .75; margin-bottom: 4%; }
  .tav-ad .ticker {
    width: 100%; background: #1f2430; color: #fff; overflow: hidden; white-space: nowrap;
    font-size: 4cqw; font-weight: 500; padding: 2.5% 0; letter-spacing: .04em;
  }
  .tav-ad .ticker span { display: inline-block; padding-left: 100%; animation: tav-marquee 12s linear infinite; }

  @keyframes tav-pulse { 50% { transform: scale(1.08) rotate(-6deg); } }
  @keyframes tav-marquee { to { transform: translateX(-100%); } }

  /* ---------- optional photo slides ---------- */
  .tav-photo {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity .8s ease;
  }
  .tav-photo.on { opacity: 1; }

  /* ---------- stat card ---------- */
  .tav-stat {
    position: absolute; left: -56px; bottom: 9%;
    display: flex; align-items: center; gap: 28px;
    padding: 18px 18px 18px 22px; min-width: 230px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 14px;
    box-shadow: 0 16px 36px -12px rgba(30,30,50,.35);
    z-index: 2;
  }
  @media (max-width: 600px) { .tav-stat { left: 12px; min-width: 0; gap: 16px; padding: 12px 14px; } }
  .tav-stat-text { transition: opacity .35s ease, transform .35s ease; }
  .tav-stat.swap .tav-stat-text { opacity: 0; transform: translateY(6px); }
  .tav-stat-value {
    display: flex; align-items: center; gap: 6px;
    font-size: 30px; font-weight: 600; color: var(--tav-text); line-height: 1.1;
  }
  .tav-stat-value svg { width: 22px; height: 22px; color: var(--tav-up); }
  .tav-stat-label { font-size: 14px; color: var(--tav-muted); margin-top: 2px; }
  .tav-avatar {
    width: 68px; height: 68px; flex: none; border-radius: 50%;
    background: linear-gradient(160deg, #5cc6e8, #2b8fc4);
    border: 3px solid #fff; box-shadow: 0 6px 14px rgba(0,0,0,.15);
    overflow: hidden; display: grid; place-items: end center;
  }
  .tav-avatar svg { width: 82%; }

  /* ---------- progress bars ---------- */
  .tav-dots {
    position: absolute; right: 26px; bottom: 22px; z-index: 2;
    display: flex; gap: 6px;
  }
  .tav-dots button {
    width: 32px; height: 4px; padding: 0; border: 0; border-radius: 2px; cursor: pointer;
    background: rgba(255,255,255,.4); position: relative; overflow: hidden;
  }
  .tav-dots button::after {
    content: ""; position: absolute; inset: 0; background: #fff;
    transform: scaleX(0); transform-origin: left;
  }
  .tav-dots button.done::after { transform: scaleX(1); opacity: .55; }
  .tav-dots button.on::after { animation: tav-fill var(--tav-dur, 5s) linear forwards; }
  .tav-showcase.paused .tav-dots button.on::after { animation-play-state: paused; }
  @keyframes tav-fill { to { transform: scaleX(1); } }
  .tav-dots button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .tav-ad, .tav-photo, .tav-stat-text { transition: none; }
    .tav-ad .new, .tav-ad .ticker span { animation: none; }
    .tav-ad .ticker span { padding-left: 0; }
  }
</style>
</head>
<body>

<div class="tav-showcase" aria-roledescription="carousel" aria-label="Digital signage examples">
  <div class="tav-frame">
    <div class="tav-scene" aria-hidden="true">
      <div class="tav-pillar l"></div><div class="tav-pillar r"></div>
      <div class="tav-alcove l"><div class="items"></div><div class="shelf" style="top:25%"></div><div class="rail"></div><div class="clothes"></div></div>
      <div class="tav-alcove r"><div class="items"></div><div class="shelf" style="top:25%"></div><div class="rail"></div><div class="clothes"></div></div>
    </div>
    <div class="tav-photos"></div>
    <div class="tav-screen"><div class="tav-display" aria-live="polite"></div></div>
  </div>

  <div class="tav-stat">
    <div class="tav-stat-text">
      <div class="tav-stat-value">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        <span class="tav-stat-num">80%</span>
      </div>
      <div class="tav-stat-label">message recall</div>
    </div>
    <div class="tav-avatar" aria-hidden="true">
      <svg viewBox="0 0 64 60">
        <circle cx="32" cy="22" r="12" fill="#e9b796"/>
        <path d="M20 18c0-9 7-13 13-13s12 4 11 13c-3-4-8-5-12-5s-9 1-12 5z" fill="#3a2a22"/>
        <path d="M6 60c2-14 12-21 26-21s24 7 26 21z" fill="#3c5f8f"/>
        <path d="M26 39l6 10 6-10z" fill="#f2f2f2"/>
      </svg>
    </div>
  </div>

  <div class="tav-dots" role="tablist" aria-label="Choose slide"></div>
</div>

<script>
(function () {
  /* ---- Edit your slides here ---- */
  var DURATION = 5000;
  var BAG = '<svg viewBox="0 0 120 150"><path d="M30 70 C20 30 45 5 60 8 C78 12 98 35 92 70" fill="none" stroke="#c97a14" stroke-width="4"/><rect x="18" y="68" width="84" height="64" rx="8" fill="#f0a52a"/><path d="M18 76 h84 v18 c-20 8-64 8-84 0z" fill="#e49516"/><rect x="54" y="88" width="14" height="12" rx="2" fill="#9aa3ad"/><rect x="57" y="91" width="8" height="6" rx="1" fill="#e6eaee"/></svg>';
  var SHOE = '<svg viewBox="0 0 150 110"><path d="M10 72 C12 52 22 40 34 38 L52 36 C60 52 80 56 96 54 C116 52 136 60 140 74 L140 84 L10 84 Z" fill="#fff" stroke="#d6dbe3" stroke-width="2"/><path d="M10 84 h130 v8 c0 4-3 6-7 6 H17 c-4 0-7-2-7-6z" fill="#2c3e66"/><path d="M40 44 L60 66 M50 40 L68 62 M60 46 L76 60" stroke="#2c3e66" stroke-width="3" stroke-linecap="round"/><path d="M92 58 C108 60 124 64 134 74" stroke="#4fb3e8" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
  var BOTTLE = '<svg viewBox="0 0 120 160"><rect x="48" y="10" width="24" height="22" rx="3" fill="#2a2a2a"/><rect x="52" y="30" width="16" height="10" fill="#c9a14a"/><rect x="22" y="40" width="76" height="104" rx="14" fill="#c7e6f2" fill-opacity=".85" stroke="#9cc9da" stroke-width="2"/><rect x="30" y="60" width="60" height="76" rx="8" fill="#8fc8de" fill-opacity=".6"/><rect x="36" y="80" width="48" height="26" rx="3" fill="#fff"/><text x="60" y="97" font-family="Georgia,serif" font-size="11" text-anchor="middle" fill="#2a4b5a">AZUR</text></svg>';
  var WATCH = '<svg viewBox="0 0 120 160"><rect x="42" y="4" width="36" height="40" rx="6" fill="#3b3f47"/><rect x="42" y="116" width="36" height="40" rx="6" fill="#3b3f47"/><circle cx="60" cy="80" r="42" fill="#c9a14a"/><circle cx="60" cy="80" r="35" fill="#101820"/><g stroke="#e7d3a1" stroke-width="2" stroke-linecap="round"><path d="M60 50v6M60 104v6M30 80h6M84 80h6"/><path d="M60 80V60M60 80l14 8"/></g><circle cx="60" cy="80" r="3" fill="#e7d3a1"/><rect x="101" y="74" width="7" height="12" rx="2" fill="#c9a14a"/></svg>';

  var SLIDES = [
    { brand: "C&amp;B", title: "Aurelia Targérine", sub: "Leather minibag", season: "Spring collection 2026",
      ticker: "Get ready to turn heads this summer with our new leather collection",
      bg: "linear-gradient(180deg,#fbe9f6,#f7dcef)", ink: "#8a6a3c", product: BAG,
      stat: "80%", label: "message recall" },
    { brand: "STRIDE", title: "Aero Runner", sub: "Lightweight trainer", season: "Now in store",
      ticker: "Try a pair today — free gait analysis in store",
      bg: "linear-gradient(180deg,#e8f3fb,#d3e8f6)", ink: "#2c3e66", product: SHOE,
      stat: "4x", label: "more eye-catching" },
    { brand: "MAISON", title: "Azur Eau", sub: "de parfum · 50ml", season: "Fragrance week",
      ticker: "Ask our team for a complimentary sample",
      bg: "linear-gradient(180deg,#f1f8f5,#dcefe9)", ink: "#2a4b5a", product: BOTTLE,
      stat: "+33%", label: "in-store sales uplift" },
    { brand: "HORA", title: "Meridian", sub: "Automatic · 40mm", season: "Limited edition",
      ticker: "Only 200 pieces — reserve yours at the counter",
      bg: "linear-gradient(180deg,#f5efe4,#e9dcc4)", ink: "#5a4320", product: WATCH,
      stat: "68%", label: "of shoppers influenced" }
    // Add a real photo slide like this (screen overlay is hidden for it):
    // { photo: "images/store.jpg", stat: "80%", label: "message recall" }
  ];
  /* -------------------------------- */

  var root = document.currentScript.previousElementSibling;
  var display = root.querySelector(".tav-display");
  var screen = root.querySelector(".tav-screen");
  var photos = root.querySelector(".tav-photos");
  var dots = root.querySelector(".tav-dots");
  var stat = root.querySelector(".tav-stat");
  var num = root.querySelector(".tav-stat-num");
  var label = root.querySelector(".tav-stat-label");
  root.style.setProperty("--tav-dur", DURATION + "ms");

  var layers = SLIDES.map(function (s, i) {
    var el = document.createElement("div");
    if (s.photo) {
      el.className = "tav-photo";
      el.style.backgroundImage = "url('" + s.photo + "')";
      photos.appendChild(el);
    } else {
      el.className = "tav-ad";
      el.style.background = s.bg;
      el.style.color = s.ink;
      el.innerHTML =
        '<div class="brand">' + s.brand + '</div>' +
        '<div class="title">' + s.title + '</div>' +
        '<div class="sub">' + s.sub + '</div>' +
        '<div class="product">' + s.product + '<div class="new">NEW</div></div>' +
        '<div class="season">' + s.season + '</div>' +
        '<div class="ticker"><span>' + s.ticker + '</span></div>';
      display.appendChild(el);
    }
    var b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", "Slide " + (i + 1));
    b.addEventListener("click", function () { go(i); });
    dots.appendChild(b);
    return el;
  });

  var current = -1, timer = null, remaining = DURATION, startedAt = 0;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function go(i) {
    if (i === current) return;
    current = i;
    var s = SLIDES[i];
    layers.forEach(function (el, j) { el.classList.toggle("on", j === i); });
    screen.style.visibility = s.photo ? "hidden" : "visible";
    [].forEach.call(dots.children, function (d, j) {
      d.classList.remove("on");
      d.classList.toggle("done", j < i);
      d.setAttribute("aria-selected", j === i);
      void d.offsetWidth; // restart fill animation
      if (j === i) d.classList.add("on");
    });
    stat.classList.add("swap");
    setTimeout(function () {
      num.textContent = s.stat;
      label.textContent = s.label;
      stat.classList.remove("swap");
    }, reduced ? 0 : 300);
    schedule(DURATION);
  }

  function schedule(ms) {
    clearTimeout(timer);
    remaining = ms; startedAt = Date.now();
    if (!root.classList.contains("paused")) {
      timer = setTimeout(function () { go((current + 1) % SLIDES.length); }, ms);
    }
  }

  root.addEventListener("mouseenter", function () {
    root.classList.add("paused");
    clearTimeout(timer);
    remaining -= Date.now() - startedAt;
  });
  root.addEventListener("mouseleave", function () {
    root.classList.remove("paused");
    schedule(Math.max(remaining, 300));
  });

  go(0);
})();
</script>
</body>
</html>
