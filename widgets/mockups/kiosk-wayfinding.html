<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinding Kiosk Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   TenAV mockup: wayfinding totem kiosk in a shopping centre.
   The same scene as in widgets/media-showcase.html, as a standalone
   image-style mockup. It plays on a loop by itself; no interactivity.
   ------------------------------------------------------------------ */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #eef0f6; font-family: "Poppins", system-ui, sans-serif; }
.mk { position: relative; margin: 0; width: min(1100px, 100%); aspect-ratio: 16 / 10; overflow: hidden; border-radius: 22px; box-shadow: 0 30px 60px -20px rgba(20,20,40,.35); }
.mk, .mk *, .mk *::before, .mk *::after { box-sizing: border-box; }
.mk .ms-scene { position: absolute; inset: 0; overflow: hidden; container-type: inline-size; }

.tk { background: linear-gradient(180deg, #f2f3f2 0%, #e6e3dd 55%, #dcd7cf 100%); }
.tk-bg { position: absolute; inset: -2%; filter: blur(.45cqw); }
.tk-bg i { position: absolute; display: block; }
.tk-person { border-radius: 40% 40% 12% 12%; opacity: .4; }
.tk-person::before { content: ""; position: absolute; left: 15%; width: 70%; aspect-ratio: 1; bottom: 100%; margin-bottom: 4%; border-radius: 50%; background: inherit; }
.tk-shadow { position: absolute; left: 47%; width: 42%; bottom: 1%; height: 7%; background: radial-gradient(ellipse at center, rgba(0,0,0,.38), transparent 68%); }
.tk-totem { position: absolute; left: 54%; top: 5%; width: 28%; height: 89%; transform: perspective(150cqw) rotateY(-16deg); transform-style: preserve-3d; }
.tk-totem::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 4cqw; transform-origin: right center; transform: rotateY(-90deg); background: linear-gradient(180deg, #0d0e11, #1c1e23); border-radius: 0 2cqw .6cqw 0; }
.tk-body { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 0 1.4cqw; background: linear-gradient(90deg, #2c3038, #1b1e24 35%, #15171c); border-radius: 2cqw 2cqw .6cqw .6cqw; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 2cqw 4cqw rgba(0,0,0,.3); }
.tk-cap { height: 4.4cqw; flex: none; display: flex; align-items: center; justify-content: center; }
.tk-cap span { width: .9cqw; height: .9cqw; border-radius: 50%; background: #3dd6ff; box-shadow: 0 0 .8cqw #3dd6ff; }
.tk-screen { position: relative; flex: none; width: 100%; aspect-ratio: 9 / 16; overflow: hidden; border-radius: .8cqw; background: #000; box-shadow: 0 0 0 .25cqw #050608; container-type: inline-size; }
.tk-screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, rgba(255,255,255,.16), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 75%, rgba(255,255,255,.06)); }
.tk-lower { flex: 1; display: grid; place-items: center; }
.tk-lower i { width: 40%; height: 1.1cqw; border-radius: 1cqw; background: repeating-linear-gradient(90deg, #0b0c0f 0 .4cqw, transparent .4cqw .8cqw); }
.tk-base { position: absolute; left: -7%; right: -7%; bottom: -1%; height: 2.4%; background: linear-gradient(180deg, #2b2f37, #0f1114); border-radius: .6cqw; }
.tk-ui { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0f141b; color: #e8edf3; font-family: inherit; }
.tk-head { display: flex; justify-content: space-between; align-items: center; padding: 4.5cqw 5cqw 3.5cqw; font-size: 4.4cqw; font-weight: 600; }
.tk-brand { display: flex; align-items: center; gap: 2cqw; }
.tk-brand i { width: 4.4cqw; height: 4.4cqw; border-radius: 1.2cqw; background: linear-gradient(135deg, #3dd6ff, #7a4dff); }
.tk-time { color: #8b97a8; font-weight: 500; }
.tk-map { position: relative; flex: none; height: 44%; margin: 0 4cqw; border-radius: 3cqw; overflow: hidden; background: #121922; }
.tk-map svg { display: block; width: 100%; height: 100%; }
.tk-map .tk-sel { fill: #1d5a6e; stroke: #3dd6ff; stroke-width: 2; }
.tk-route { fill: none; stroke: #3dd6ff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.tk-pulse { animation: tk-pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.tk-floor { position: absolute; right: 3cqw; top: 3cqw; padding: 1cqw 2.4cqw; border-radius: 2cqw; background: rgba(15,20,27,.85); font-size: 3.4cqw; font-weight: 600; }
.tk-dest { position: absolute; left: 3cqw; right: 3cqw; bottom: 3cqw; display: flex; align-items: center; gap: 2.5cqw; padding: 2.6cqw 3cqw; border-radius: 2.6cqw; background: rgba(15,20,27,.94); border: 1px solid rgba(255,255,255,.08); font-size: 3.2cqw; opacity: 0; transform: translateY(2cqw); transition: opacity .35s, transform .45s; }
.tk-dest.on { opacity: 1; transform: none; }
.tk-dest b { display: block; font-size: 4.2cqw; }
.tk-dest em { font-style: normal; color: #8b97a8; }
.tk-dest strong { margin-left: auto; padding: 1.2cqw 2.6cqw; border-radius: 2cqw; background: #3dd6ff; color: #06202a; font-size: 3.6cqw; white-space: nowrap; }
.tk-search { flex: none; margin: 4cqw 4cqw 0; height: 11cqw; display: flex; align-items: center; gap: 2.4cqw; padding: 0 4cqw; border-radius: 5.5cqw; background: #1b2330; font-size: 4.4cqw; color: #8b97a8; }
.tk-search svg { width: 4.6cqw; flex: none; }
.tk-q { color: #fff; }
.tk-caret { width: .5cqw; height: 5cqw; background: #3dd6ff; animation: tk-blink 1s steps(2) infinite; }
.tk-search.has-q .tk-ph { display: none; }
.tk-chips { flex: none; display: flex; gap: 2cqw; margin: 3.4cqw 4cqw 0; }
.tk-chips span { padding: 1.5cqw 3cqw; border-radius: 4cqw; background: #1b2330; color: #b8c2d0; font-size: 3.4cqw; white-space: nowrap; transition: background .3s, color .3s; }
.tk-chips span.on { background: #3dd6ff; color: #06202a; font-weight: 600; }
.tk-label { margin: 4cqw 5cqw 2cqw; font-size: 3cqw; letter-spacing: .14em; text-transform: uppercase; color: #6b7686; font-weight: 600; }
.tk-results { display: flex; flex-direction: column; gap: 1.6cqw; margin: 0 4cqw; }
.tk-results div { display: flex; align-items: center; gap: 2.6cqw; padding: 2.2cqw 2.6cqw; border-radius: 2.4cqw; background: #151c26; font-size: 3.8cqw; transition: background .3s, box-shadow .3s; }
.tk-results div.sel { background: #1f2c3a; box-shadow: inset 0 0 0 1px #3dd6ff; }
.tk-results i { width: 6cqw; height: 6cqw; flex: none; border-radius: 1.6cqw; }
.tk-results em { display: block; font-style: normal; font-size: 3cqw; color: #8b97a8; }
.tk-results small { margin-left: auto; font-size: 3.2cqw; color: #8b97a8; }
.tk-foot { margin-top: auto; display: flex; justify-content: space-between; padding: 3cqw 5cqw; border-top: 1px solid rgba(255,255,255,.06); font-size: 3cqw; color: #6b7686; }
.tk-touch { position: absolute; width: 14cqw; aspect-ratio: 1; margin: -7cqw 0 0 -7cqw; border-radius: 50%; border: 1cqw solid rgba(255,255,255,.75); background: rgba(61,214,255,.25); opacity: 0; pointer-events: none; }
.tk-touch.go { animation: tk-touch .8s ease-out; }
@keyframes tk-pulse { from { transform: scale(.6); opacity: .8; } to { transform: scale(2.4); opacity: 0; } }
@keyframes tk-blink { 50% { opacity: 0; } }
@keyframes tk-touch { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }

@media (prefers-reduced-motion: reduce) {
  .mk *, .mk *::before, .mk *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<figure class="mk" role="img" aria-label="Mockup: a freestanding wayfinding kiosk in a shopping centre, demonstrating a search and a route on its map">
<div class="ms-scene tk" aria-hidden="true" data-scene="tk" data-type="Wayfinding kiosk" data-caption="Shopping centre">
  <div class="tk-bg">
    <i style="left:0;top:0;width:100%;height:9%;background:linear-gradient(180deg,#fbfcfc,#e7ecee)"></i>
    <i style="left:0;top:0;width:100%;height:9%;background:repeating-linear-gradient(90deg,transparent 0 11.5%,rgba(140,150,156,.4) 11.5% 12%)"></i>
    <i style="left:0;top:9%;width:100%;height:2.5%;background:#e4e1db;box-shadow:0 .4cqw .6cqw rgba(0,0,0,.06)"></i>
    <i style="left:0;top:11.5%;width:100%;height:19%;background:linear-gradient(180deg,#d3dbde,#e6eaeb)"></i>
    <i style="left:0;top:11.5%;width:100%;height:19%;background:repeating-linear-gradient(90deg,transparent 0 13.6%,rgba(60,68,76,.45) 13.6% 14%)"></i>
    <i style="left:3%;top:15%;width:10%;height:13%;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,206,.9),transparent 70%)"></i>
    <i style="left:44%;top:15%;width:12%;height:13%;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,206,.8),transparent 70%)"></i>
    <i style="left:86%;top:15%;width:10%;height:13%;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,206,.85),transparent 70%)"></i>
    <i style="left:0;top:30.5%;width:100%;height:3%;background:#ebe8e2"></i>
    <i style="left:0;top:33.5%;width:100%;height:6%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.3));border-top:.4cqw solid #9a9894"></i>
    <i style="left:0;top:39.5%;width:100%;height:3%;background:#dcd8d1"></i>
    <i style="left:0;top:42.5%;width:100%;height:25%;background:linear-gradient(180deg,#e9e1d2,#d5ccbd)"></i>
    <i style="left:0;top:42.5%;width:100%;height:25%;background:repeating-linear-gradient(90deg,transparent 0 15.6%,rgba(48,54,62,.55) 15.6% 16.2%)"></i>
    <i style="left:2%;top:44%;width:9%;height:2%;background:#3a4048"></i>
    <i style="left:34%;top:44%;width:8%;height:2%;background:#3a4048"></i>
    <i style="left:83%;top:44%;width:9%;height:2%;background:#3a4048"></i>
    <i style="left:22%;top:9%;width:3.4%;height:59%;background:linear-gradient(90deg,#94704e,#c29a6e 40%,#8a6646)"></i>
    <i style="left:74%;top:9%;width:3.4%;height:59%;background:linear-gradient(90deg,#94704e,#c29a6e 40%,#8a6646)"></i>
    <i style="left:0;top:67.5%;width:100%;height:35%;background:linear-gradient(180deg,#ece8e2,#d9d4cc)"></i>
    <i style="left:0;top:67.5%;width:100%;height:12%;background:linear-gradient(180deg,rgba(150,120,90,.16),transparent)"></i>
    <i class="tk-person" style="left:12%;top:49%;height:19%;width:3%;background:#4a505a"></i>
    <i class="tk-person" style="left:36%;top:51%;height:17%;width:2.6%;background:#6b5d55"></i>
  </div>  <div class="tk-shadow"></div>
  <div class="tk-totem">
    <div class="tk-body">
      <div class="tk-cap"><span></span></div>
      <div class="tk-screen">
        <div class="tk-ui">
          <div class="tk-head"><span class="tk-brand"><i></i>Northgate</span><span class="tk-time">10:24</span></div>
          <div class="tk-map">
            <svg viewBox="0 0 300 256"></svg>
            <div class="tk-floor">G</div>
            <div class="tk-dest"><span><b class="tk-dn">Café Nova</b><em class="tk-dt">Food &amp; drink · Ground floor</em></span><strong class="tk-dm">2 min</strong></div>
          </div>
          <div class="tk-search"><svg viewBox="0 0 24 24" fill="none" stroke="#8b97a8" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="tk-q"></span><i class="tk-caret"></i><span class="tk-ph">Where to?</span></div>
          <div class="tk-chips"><span>Shops</span><span>Food</span><span>Toilets</span><span>Help</span></div>
          <div class="tk-label">Popular right now</div>
          <div class="tk-results"></div>
          <div class="tk-foot"><span>English · Cymraeg · Polski</span><span>Aa Larger text</span></div>
        </div>
        <div class="tk-touch"></div>
      </div>
      <div class="tk-lower"><i></i></div>
    </div>
    <div class="tk-base"></div>
  </div>
</div>
</figure>

<script>
(function () {
  var root = document.querySelector(".mk .ms-scene");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function pad(n) { return (n < 10 ? "0" : "") + n; }

function kiosk(el) {
  var NS = "http://www.w3.org/2000/svg", svg = el.querySelector(".tk-map svg"), screen = el.querySelector(".tk-screen");
  var q = el.querySelector(".tk-q"), search = el.querySelector(".tk-search"), chips = el.querySelectorAll(".tk-chips span");
  var label = el.querySelector(".tk-label"), results = el.querySelector(".tk-results"), dest = el.querySelector(".tk-dest"), touch = el.querySelector(".tk-touch");
  // map: shops as [id, x, y, w, h, colour]
  var SHOPS = [["A",14,14,54,44,"#2c3746"],["B",72,14,58,44,"#313d4d"],["C",14,62,116,46,"#2a3543"],["D",170,14,116,44,"#344152"],["E",170,62,56,46,"#2e3a49"],["F",230,62,56,46,"#2a3543"],
               ["G",14,146,58,46,"#313d4d"],["H",76,146,54,46,"#2c3746"],["I",14,196,116,46,"#344152"],["J",170,146,56,96,"#2e3a49"],["K",230,146,56,46,"#2c3746"],["L",230,196,56,46,"#313d4d"]];
  var PLACES = {
    "Café Nova":             { c: "#c98a3f", tag: "Food & drink", m: "2 min", shop: "H", d: "M30 127H103V144" },
    "Café Bloom":            { c: "#d07a9a", tag: "Food & drink", m: "4 min", shop: "E", d: "M30 127H198V110" },
    "Toilets":               { c: "#3d8bff", tag: "Facilities",   m: "1 min", d: "M30 127H268" },
    "Accessible toilet":     { c: "#3d8bff", tag: "Facilities",   m: "2 min", d: "M30 127H150V226" },
    "Northside Dept. Store": { c: "#d9a441", tag: "Shops",        m: "3 min", shop: "D", d: "M30 127H150V36H168" },
    "TechHub":               { c: "#4f7cff", tag: "Shops",        m: "3 min", shop: "J", d: "M30 127H150V190H168" },
    "Food court":            { c: "#9b6bd6", tag: "Food & drink", m: "2 min", shop: "I", d: "M30 127H150V219H132" }
  };
  function el2(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  el2("rect", { x: 6, y: 6, width: 288, height: 244, rx: 14, fill: "#121922", stroke: "#1f2a37", "stroke-width": 2 });
  el2("rect", { x: 10, y: 114, width: 280, height: 26, rx: 8, fill: "#222c39" });
  el2("rect", { x: 136, y: 10, width: 28, height: 236, rx: 8, fill: "#222c39" });
  el2("circle", { cx: 150, cy: 127, r: 20, fill: "#283444" }); el2("circle", { cx: 150, cy: 127, r: 11, fill: "#1d2531" });
  var shopEls = {};
  SHOPS.forEach(function (s) { shopEls[s[0]] = el2("rect", { x: s[1], y: s[2], width: s[3], height: s[4], rx: 5, fill: s[5] }); });
  [["WC", 280, 127], ["WC", 150, 238], ["L", 150, 18]].forEach(function (a) {
    el2("circle", { cx: a[1], cy: a[2], r: 9, fill: "#2a7fff", stroke: "#0f141b", "stroke-width": 2 });
    var t = el2("text", { x: a[1], y: a[2] + 3.5, "text-anchor": "middle", "font-size": 9, "font-weight": 700, fill: "#fff", "font-family": "Poppins, sans-serif" }); t.textContent = a[0];
  });
  var route = el2("path", { class: "tk-route", d: "" });
  var endDot = el2("circle", { r: 7, fill: "#3dd6ff", stroke: "#0f141b", "stroke-width": 3, opacity: 0 });
  el2("circle", { class: "tk-pulse", cx: 30, cy: 127, r: 9, fill: "#ff5a36", opacity: .5 });
  el2("circle", { cx: 30, cy: 127, r: 7, fill: "#ff5a36", stroke: "#fff", "stroke-width": 3 });

  var T = [];
  function at(ms, fn) { T.push(setTimeout(fn, ms)); }
  function list(names, sel) {
    results.innerHTML = names.map(function (n, k) {
      var p = PLACES[n];
      return '<div' + (k === sel ? ' class="sel"' : '') + '><i style="background:' + p.c + '"></i><span>' + n + '<em>' + p.tag.replace("&", "&amp;") + '</em></span><small>' + p.m + '</small></div>';
    }).join("");
  }
  function clearRoute() {
    route.setAttribute("d", ""); endDot.setAttribute("opacity", 0); dest.classList.remove("on");
    for (var k in shopEls) shopEls[k].classList.remove("tk-sel");
  }
  function select(name) {
    var p = PLACES[name];
    clearRoute();
    if (p.shop) shopEls[p.shop].classList.add("tk-sel");
    route.setAttribute("d", p.d);
    var L = route.getTotalLength(), end = route.getPointAtLength(L);
    route.style.transition = "none"; route.style.strokeDasharray = L; route.style.strokeDashoffset = L;
    route.getBoundingClientRect();
    route.style.transition = "stroke-dashoffset 1.1s ease"; route.style.strokeDashoffset = 0;
    endDot.setAttribute("cx", end.x); endDot.setAttribute("cy", end.y);
    setTimeout(function () { endDot.setAttribute("opacity", 1); }, reduced ? 0 : 1000);
    el.querySelector(".tk-dn").textContent = name;
    el.querySelector(".tk-dt").textContent = p.tag + " · Ground floor";
    el.querySelector(".tk-dm").textContent = p.m;
    dest.classList.add("on");
  }
  function tap(target) { // touch ripple, positioned in the screen's own (untransformed) coordinates
    var x = target.offsetWidth / 2, y = target.offsetHeight / 2, e = target;
    while (e && e !== screen) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
    touch.style.left = x + "px"; touch.style.top = y + "px";
    touch.classList.remove("go"); void touch.offsetWidth; touch.classList.add("go");
  }
  function chip(n) { for (var k = 0; k < chips.length; k++) chips[k].classList.toggle("on", k === n); }
  function reset() {
    var d = new Date();
    el.querySelector(".tk-time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    q.textContent = ""; search.classList.remove("has-q"); chip(-1); clearRoute();
    label.textContent = "Popular right now";
    list(["Northside Dept. Store", "TechHub", "Food court"], -1);
  }
  reset();
  return {
    enter: function () {
      T.forEach(clearTimeout); T = []; reset();
      at(500, function () { tap(search); });
      "Café".split("").forEach(function (ch, k) { at(750 + k * 150, function () { q.textContent += ch; search.classList.add("has-q"); }); });
      at(1450, function () { label.textContent = "Results"; list(["Café Nova", "Café Bloom"], -1); });
      at(2200, function () { list(["Café Nova", "Café Bloom"], 0); tap(results.children[0]); select("Café Nova"); });
      at(4700, function () { chip(2); tap(chips[2]); q.textContent = "Toilets"; clearRoute(); list(["Toilets", "Accessible toilet"], -1); });
      at(5500, function () { list(["Toilets", "Accessible toilet"], 0); tap(results.children[0]); select("Toilets"); });
    },
    leave: function () { T.forEach(clearTimeout); T = []; }
  };
}

  var scene = kiosk(root);
  scene.enter();
  setInterval(function () { scene.leave(); scene.enter(); }, 8000); // replay the sequence
})();
</script>
</body>
</html>
