<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curved LED Wall Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   TenAV mockup: curved LED video wall in a corporate lobby.
   The same scene as in widgets/media-showcase.html, as a standalone
   image-style mockup. It plays on a loop by itself; no interactivity.
   ------------------------------------------------------------------ */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #eef0f6; font-family: "Poppins", system-ui, sans-serif; }
.mk { position: relative; margin: 0; width: min(1100px, 100%); aspect-ratio: 16 / 10; overflow: hidden; border-radius: 22px; box-shadow: 0 30px 60px -20px rgba(20,20,40,.35); }
.mk, .mk *, .mk *::before, .mk *::after { box-sizing: border-box; }
.mk .ms-scene { position: absolute; inset: 0; overflow: hidden; container-type: inline-size; }

.lw { background: #d9d6cf; }
.lw canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

@media (prefers-reduced-motion: reduce) {
  .mk *, .mk *::before, .mk *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<figure class="mk" role="img" aria-label="Mockup: a curved LED video wall in a bright corporate lobby showing a night-time city skyline, with people looking at it">
<div class="ms-scene lw" data-scene="lw" data-caption="Corporate lobby">
  <canvas></canvas>
</div>
</figure>

<script>
(function () {
  var root = document.querySelector(".mk .ms-scene");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function pad(n) { return (n < 10 ? "0" : "") + n; }

function ledWall(el) {
  var S = {
    eye: 1.6, focal: .5, centerX: .5, horizon: .5,
    left: [-8.6, 12.8], right: [3.4, 3.7], sag: 1.5,   // wall curve in plan view (metres)
    ledBottom: .3, ledTop: 3.9, ceiling: 5.4, wallFrom: -.06, wallTo: 1.14,
    people: [[-6.4, 11.4, 1.78, "m"], [-5.2, 10.6, 1.66, "f"], [-2, 6.9, 1.8, "m"], [-1.25, 6.7, 1.65, "f"], [.15, 6.7, 1.68, "f"]]
  };
  var canvas = el.querySelector("canvas"), ctx = canvas.getContext("2d");
  var W = 0, H, F, CX, HY, bg, people, refl, rc, on = false, raf = 0;
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  function plan(t) { // quadratic Bezier for the wall in plan view
    var L = S.left, R = S.right, mx = (L[0] + R[0]) / 2, mz = (L[1] + R[1]) / 2;
    var dx = R[0] - L[0], dz = R[1] - L[1], len = Math.hypot(dx, dz), nx = -dz / len, nz = dx / len;
    if (nx * -mx + nz * -mz > 0) { nx = -nx; nz = -nz; }
    var c = [mx + nx * S.sag * 2, mz + nz * S.sag * 2], a = (1 - t) * (1 - t), b = 2 * t * (1 - t), d = t * t;
    return [a * L[0] + b * c[0] + d * R[0], a * L[1] + b * c[1] + d * R[1], nx, nz];
  }
  function proj(x, y, z) { z = Math.max(z, .4); return [CX + F * x / z, HY - F * (y - S.eye) / z]; }
  function wallPt(t, y) { var p = plan(t); return [p[0], y, p[1]]; }
  function P(t, y) { return proj.apply(null, wallPt(t, y)); }

  // content shown on the wall, drawn flat then projected onto the curve
  var CW = 2400, CH = 600;
  var content = document.createElement("canvas"); content.width = CW; content.height = CH;
  var cc = content.getContext("2d");
  var flipped = document.createElement("canvas"); flipped.width = CW; flipped.height = CH;
  var fc = flipped.getContext("2d");
  var city = document.createElement("canvas"); city.width = CW; city.height = CH;
  (function () {
    var g = city.getContext("2d"), sky = g.createLinearGradient(0, 0, 0, CH);
    sky.addColorStop(0, "#07142f"); sky.addColorStop(.45, "#1d4a8c"); sky.addColorStop(.75, "#4a7fc0"); sky.addColorStop(1, "#0d1b33");
    g.fillStyle = sky; g.fillRect(0, 0, CW, CH);
    var sun = g.createRadialGradient(CW * .08, CH * .72, 0, CW * .08, CH * .72, CW * .3);
    sun.addColorStop(0, "rgba(255,150,100,.95)"); sun.addColorStop(.4, "rgba(240,120,140,.45)"); sun.addColorStop(1, "rgba(240,120,140,0)");
    g.fillStyle = sun; g.fillRect(0, 0, CW, CH);
    for (var i = 0; i < 140; i++) { g.fillStyle = "rgba(255,255,255," + rnd() * .6 + ")"; g.fillRect(rnd() * CW, rnd() * CH * .4, 2, 2); }
    [[.62, "#1a2c55", .3], [.7, "#0f1d3d", .55], [.8, "#08122a", .9]].forEach(function (layer) {
      var x = 0;
      while (x < CW) {
        var w = 30 + rnd() * 70, centre = 1 - Math.abs(x / CW - .26) * 1.6;
        var h = CH * (.1 + rnd() * .22 + Math.max(0, centre) * rnd() * .45 * layer[2]), top = CH * layer[0] - h + CH * .2;
        g.fillStyle = layer[1]; g.fillRect(x, top, w, CH - top);
        if (rnd() > .7) g.fillRect(x + w * .4, top - h * .15, w * .2, h * .15);
        for (var wy = top + 8; wy < CH; wy += 9) for (var wx = x + 5; wx < x + w - 4; wx += 8) {
          if (rnd() > .62) { g.fillStyle = rnd() > .3 ? "rgba(255,220,150," + (.4 + rnd() * .5) * layer[2] + ")" : "rgba(120,220,255," + .7 * layer[2] + ")"; g.fillRect(wx, wy, 3, 4); }
        }
        x += w + 2 + rnd() * 8;
      }
    });
  })();
  var streaks = [], sparks = [], i;
  for (i = 0; i < 26; i++) streaks.push({ y: .35 + rnd() * .6, bend: (rnd() - .5) * .5, speed: .04 + rnd() * .08, off: rnd(), len: .15 + rnd() * .3, hue: rnd() > .25 ? 190 + rnd() * 20 : 320, w: 1 + rnd() * 3 });
  for (i = 0; i < 70; i++) sparks.push({ x: rnd(), y: rnd() * .7, s: 1 + rnd() * 3, v: .01 + rnd() * .03, p: rnd() * 6 });

  function drawContent(t) {
    cc.globalCompositeOperation = "source-over";
    cc.drawImage(city, 0, 0);
    cc.globalCompositeOperation = "lighter";
    streaks.forEach(function (s) {
      var head = ((t * s.speed + s.off) % 1.4) - .2, tail = head - s.len;
      cc.beginPath();
      for (var k = 0; k <= 20; k++) {
        var u = tail + (head - tail) * k / 20, x = u * CW, y = (s.y - u * .35 + Math.sin(u * 3 + s.bend * 6) * s.bend * .2) * CH;
        k ? cc.lineTo(x, y) : cc.moveTo(x, y);
      }
      cc.strokeStyle = "hsla(" + s.hue + ",100%,60%,.18)"; cc.lineWidth = s.w * 6; cc.stroke();
      cc.strokeStyle = "hsla(" + s.hue + ",100%,80%,.9)"; cc.lineWidth = s.w; cc.stroke();
    });
    sparks.forEach(function (p) {
      cc.fillStyle = "rgba(160,230,255," + (.4 + .6 * Math.abs(Math.sin(t * 1.5 + p.p))) + ")";
      cc.beginPath(); cc.arc(((p.x + t * p.v) % 1) * CW, p.y * CH, p.s, 0, 7); cc.fill();
    });
    cc.globalCompositeOperation = "source-over";
    cc.shadowColor = "rgba(0,10,40,.6)"; cc.shadowBlur = 14;
    cc.fillStyle = "#3dd6ff"; cc.fillRect(CW * .5, CH * .15, 60, 5);
    cc.fillStyle = "rgba(255,255,255,.8)"; cc.font = "600 26px 'Space Grotesk', sans-serif"; cc.fillText("NORTHGATE GROUP", CW * .5, CH * .15 + 44);
    cc.fillStyle = "#fff"; cc.font = "700 80px 'Space Grotesk', sans-serif"; cc.fillText("Building smarter cities", CW * .5, CH * .15 + 128);
    cc.shadowBlur = 0;
    fc.setTransform(1, 0, 0, -1, 0, CH); fc.drawImage(content, 0, 0);
  }

  function strip(g, from, to, y0, y1, color) {
    var k, n = 120, p;
    g.fillStyle = color; g.beginPath();
    for (k = 0; k <= n; k++) { p = P(from + (to - from) * k / n, y1); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    for (k = n; k >= 0; k--) { p = P(from + (to - from) * k / n, y0); g.lineTo(p[0], p[1]); }
    g.fill();
  }
  function drawRoom() {
    bg = document.createElement("canvas"); bg.width = W; bg.height = H;
    var g = bg.getContext("2d"), i, k, p;
    var ceil = g.createLinearGradient(0, 0, 0, HY); ceil.addColorStop(0, "#d8d6d1"); ceil.addColorStop(1, "#ecebe7");
    g.fillStyle = ceil; g.fillRect(0, 0, W, HY);
    var floor = g.createLinearGradient(0, HY, 0, H); floor.addColorStop(0, "#d6d3cd"); floor.addColorStop(1, "#a9a49b");
    g.fillStyle = floor; g.fillRect(0, HY, W, H - HY);
    g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 1;
    for (i = 0; i < 40; i++) { var vy = HY + rnd() * (H - HY), vx = rnd() * W; g.beginPath(); g.moveTo(vx, vy); g.bezierCurveTo(vx + 60, vy + 10, vx + 120, vy - 6, vx + 200, vy + 14); g.stroke(); }
    // glass facade on the left
    var zf = 18, top = proj(0, S.ceiling, zf)[1], bot = proj(0, 0, zf)[1], wallLeft = P(S.wallFrom, 0)[0];
    var win = g.createLinearGradient(0, top, 0, bot); win.addColorStop(0, "#f7fafc"); win.addColorStop(.6, "#e3ecf1"); win.addColorStop(1, "#cfd8dc");
    g.fillStyle = win; g.fillRect(0, top, wallLeft + 2, bot - top);
    g.fillStyle = "#9aa2a8";
    for (var mx = -18; mx < 0; mx += 2.2) { var px = proj(mx, 0, zf)[0]; if (px < wallLeft) g.fillRect(px, top, Math.max(2, F * .08 / zf), bot - top); }
    g.fillRect(0, proj(0, 3.4, zf)[1], wallLeft, 2);
    var dx = proj(-14, 0, zf)[0], dw = F * 2.6 / zf, dt = proj(0, 2.6, zf)[1];
    g.fillStyle = "rgba(160,170,175,.5)"; g.fillRect(dx, dt, dw, bot - dt);
    g.fillStyle = "#8d959b"; g.fillRect(dx - 2, dt - 6, dw + 4, 6); g.fillRect(dx + dw / 2 - 1, dt, 2, bot - dt);
    // ceiling light strips
    [-2.4, 2.4].forEach(function (lx) {
      var a = proj(lx - .12, S.ceiling, 2.6), b = proj(lx + .12, S.ceiling, 2.6), c = proj(lx + .12, S.ceiling, 15), d = proj(lx - .12, S.ceiling, 15);
      g.fillStyle = "rgba(255,255,255,.95)"; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.fill();
    });
    // curved back wall with panel joints
    var N = 260;
    for (i = 0; i < N; i++) {
      var t0 = S.wallFrom + (S.wallTo - S.wallFrom) * i / N, t1 = S.wallFrom + (S.wallTo - S.wallFrom) * (i + 1) / N;
      var p0b = P(t0, 0), p0t = P(t0, S.ceiling), p1b = P(t1, 0), p1t = P(t1, S.ceiling), shade = 236 - Math.round((t0 - S.wallFrom) * 14);
      g.fillStyle = "rgb(" + shade + "," + (shade - 6) + "," + (shade - 18) + ")";
      g.beginPath(); g.moveTo(p0t[0], p0t[1]); g.lineTo(p1t[0] + .5, p1t[1]); g.lineTo(p1b[0] + .5, p1b[1]); g.lineTo(p0b[0], p0b[1]); g.fill();
    }
    g.strokeStyle = "rgba(150,140,120,.35)"; g.lineWidth = 1;
    for (var tt = S.wallFrom; tt <= S.wallTo; tt += .045) { var a1 = P(tt, 0), a2 = P(tt, S.ceiling); g.beginPath(); g.moveTo(a1[0], a1[1]); g.lineTo(a2[0], a2[1]); g.stroke(); }
    [1.2, 2.4, 3.6, 4.8].forEach(function (hy) {
      g.beginPath();
      for (var k = 0; k <= 80; k++) { var p = P(S.wallFrom + (S.wallTo - S.wallFrom) * k / 80, hy); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
      g.stroke();
    });
    g.strokeStyle = "rgba(255,248,230,.9)"; g.lineWidth = Math.max(2, W / 500); g.beginPath();
    for (k = 0; k <= 80; k++) { p = P(S.wallFrom + (S.wallTo - S.wallFrom) * k / 80, S.ceiling - .05); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
    // LED casing and its near end cap
    strip(g, -.012, 1, S.ledBottom - .1, S.ledTop + .08, "#0b0c10");
    var e = plan(1), d1 = .32;
    var ct = proj(e[0], S.ledTop + .08, e[1]), cb = proj(e[0], S.ledBottom - .1, e[1]);
    var nt = proj(e[0] - e[2] * d1, S.ledTop + .08, e[1] - e[3] * d1), nb = proj(e[0] - e[2] * d1, S.ledBottom - .1, e[1] - e[3] * d1);
    g.fillStyle = "#16171c"; g.beginPath(); g.moveTo(ct[0], ct[1]); g.lineTo(nt[0], nt[1]); g.lineTo(nb[0], nb[1]); g.lineTo(cb[0], cb[1]); g.fill();
    g.globalAlpha = .25; strip(g, 0, 1, -.001, 0, "#000"); g.globalAlpha = 1;
  }

  function person(g, h, type) {
    var suit = type === "m" ? "#1d2433" : "#22252e", skin = "#c99a7c";
    g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(0, 0, h * .16, h * .02, 0, 0, 7); g.fill();
    if (type === "m") {
      g.fillStyle = "#14161c"; g.fillRect(-h * .075, -h * .48, h * .065, h * .47); g.fillRect(h * .01, -h * .48, h * .065, h * .47);
      g.fillRect(-h * .085, -h * .02, h * .08, h * .02); g.fillRect(h * .01, -h * .02, h * .085, h * .02);
    } else {
      g.fillStyle = skin; g.fillRect(-h * .05, -h * .3, h * .035, h * .28); g.fillRect(h * .015, -h * .3, h * .035, h * .28);
      g.fillStyle = "#111"; g.fillRect(-h * .06, -h * .02, h * .05, h * .02); g.fillRect(h * .01, -h * .02, h * .05, h * .02);
      g.fillStyle = suit; g.beginPath(); g.moveTo(-h * .09, -h * .52); g.lineTo(h * .09, -h * .52); g.lineTo(h * .1, -h * .3); g.lineTo(-h * .1, -h * .3); g.fill();
    }
    g.fillStyle = suit; g.beginPath();
    g.moveTo(-h * .1, -h * .46); g.lineTo(-h * .13, -h * .78); g.quadraticCurveTo(-h * .12, -h * .83, -h * .05, -h * .835);
    g.lineTo(h * .05, -h * .835); g.quadraticCurveTo(h * .12, -h * .83, h * .13, -h * .78); g.lineTo(h * .1, -h * .46); g.fill();
    g.fillStyle = "#e9edf2"; g.beginPath(); g.moveTo(-h * .03, -h * .83); g.lineTo(h * .03, -h * .83); g.lineTo(0, -h * .72); g.fill();
    g.fillStyle = suit; g.fillRect(-h * .15, -h * .78, h * .04, h * .32); g.fillRect(h * .11, -h * .78, h * .04, h * .32);
    g.fillStyle = skin; g.fillRect(-h * .025, -h * .87, h * .05, h * .05);
    g.beginPath(); g.ellipse(0, -h * .92, h * .055, h * .07, 0, 0, 7); g.fill();
    g.fillStyle = type === "m" ? "#1b1410" : "#2a1c14";
    g.beginPath(); g.ellipse(0, -h * .955, h * .058, h * .04, 0, Math.PI, 0); g.fill();
    if (type === "f") { g.beginPath(); g.ellipse(0, -h * .88, h * .07, h * .1, 0, Math.PI * 1.05, -Math.PI * .05); g.fill(); g.fillRect(-h * .068, -h * .9, h * .03, h * .12); g.fillRect(h * .038, -h * .9, h * .03, h * .12); }
  }
  function drawPeople() {
    people = document.createElement("canvas"); people.width = W; people.height = H;
    var g = people.getContext("2d");
    S.people.slice().sort(function (a, b) { return b[1] - a[1]; }).forEach(function (p) {
      var feet = proj(p[0], 0, p[1]), h = F * p[2] / p[1];
      g.save(); g.globalAlpha = .16; g.translate(feet[0], feet[1]); g.scale(1, -.9); person(g, h, p[3]); g.restore();
      g.save(); g.translate(feet[0], feet[1]); person(g, h, p[3]); g.restore();
    });
  }

  function frame(time) {
    if (!W) return;
    drawContent(time / 1000);
    ctx.drawImage(bg, 0, 0);
    rc.clearRect(0, 0, W, H);
    var N = Math.round(W / 3), prev = null;
    for (var i = 0; i <= N; i++) {
      var p = plan(i / N), top = proj(p[0], S.ledTop, p[1]), bot = proj(p[0], S.ledBottom, p[1]);
      var rt = proj(p[0], -S.ledTop, p[1]), rb = proj(p[0], -S.ledBottom, p[1]);
      if (prev) {
        var x = prev[0], w = top[0] - prev[0] + .8, sx = (i - 1) / N * CW, sw = CW / N + .5;
        ctx.drawImage(content, sx, 0, sw, CH, x, top[1], w, bot[1] - top[1]);
        rc.drawImage(flipped, sx, 0, sw, CH, x, rb[1], w, rt[1] - rb[1]);
      }
      prev = top;
    }
    ctx.globalAlpha = .16; ctx.drawImage(refl, 0, 0); ctx.globalAlpha = 1;
    var fade = ctx.createLinearGradient(0, HY + H * .12, 0, H);
    fade.addColorStop(0, "rgba(190,186,178,0)"); fade.addColorStop(1, "rgba(170,165,156,.9)");
    ctx.fillStyle = fade; ctx.fillRect(0, HY + H * .12, W, H);
    ctx.drawImage(people, 0, 0);
  }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = el.clientWidth, h = el.clientHeight;
    if (!w || !h) return;
    W = canvas.width = Math.round(w * dpr); H = canvas.height = Math.round(h * dpr);
    F = W * S.focal; CX = W * S.centerX; HY = H * S.horizon;
    refl = document.createElement("canvas"); refl.width = W; refl.height = H; rc = refl.getContext("2d");
    seed = 11; drawRoom(); drawPeople(); frame(performance.now());
  }
  new ResizeObserver(resize).observe(el);
  if (document.fonts) document.fonts.ready.then(function () { if (W) frame(performance.now()); });
  function loop(t) { if (!on) return; frame(t); raf = requestAnimationFrame(loop); }
  return {
    enter: function () { on = true; cancelAnimationFrame(raf); if (reduced) { frame(0); return; } raf = requestAnimationFrame(loop); },
    leave: function () { on = false; cancelAnimationFrame(raf); }
  };
}

  var scene = ledWall(root);
  scene.enter();
  setInterval(function () { scene.leave(); scene.enter(); }, 8000); // replay the sequence
})();
</script>
</body>
</html>
