<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiting Room Display Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   TenAV mockup: digital display in a clinic waiting room.
   The same scene as in widgets/media-showcase.html, as a standalone
   image-style mockup. It plays on a loop by itself; no interactivity.
   ------------------------------------------------------------------ */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #eef0f6; font-family: "Poppins", system-ui, sans-serif; }
.mk { position: relative; margin: 0; width: min(1100px, 100%); aspect-ratio: 16 / 10; overflow: hidden; border-radius: 22px; box-shadow: 0 30px 60px -20px rgba(20,20,40,.35); }
.mk, .mk *, .mk *::before, .mk *::after { box-sizing: border-box; }
.mk .ms-scene { position: absolute; inset: 0; overflow: hidden; container-type: inline-size; }

.wr { background: #23403f; }
.wr-ceiling { position: absolute; left: 0; right: 0; top: 0; height: 8%; background: linear-gradient(180deg, #4c5553, #6e7774); }
.wr-ceiling i { position: absolute; top: 38%; width: 5%; height: 24%; border-radius: 50%; background: radial-gradient(#fff 40%, rgba(255,255,255,.2) 70%, transparent 72%); box-shadow: 0 0 2cqw 1cqw rgba(255,255,255,.25); }
.wr-corridor { position: absolute; left: 0; top: 8%; width: 24%; bottom: 0; background: linear-gradient(180deg, #2a4a49 0%, #3d6a67 45%, #2b4645 64%, #5f7a76 64.5%, #2a3433 100%); }
.wr-corridor::before { content: ""; position: absolute; left: 0; right: 0; top: 18%; height: 42%; background: linear-gradient(90deg, transparent 0 31%, #1f3534 31% 32%, transparent 32% 64%, #1f3534 64% 65%, transparent 65%), linear-gradient(180deg, rgba(160,220,215,.35), rgba(80,140,135,.2)); }
.wr-exit { position: absolute; left: 18%; top: 22%; width: 14%; height: 2.6%; background: #28c76f; border-radius: 2px; box-shadow: 0 0 1cqw #28c76f; opacity: .8; }
.wr-wall { position: absolute; left: 24%; right: 0; top: 8%; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 30%), linear-gradient(100deg, #5f9d97 0%, #7ab3ab 35%, #6aa59e 60%, #528c86 100%); box-shadow: inset 1.2cqw 0 2cqw rgba(0,0,0,.35); }
.wr-grid { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,50,48,.55) 0 2px, transparent 2px) 0 0 / 33.33% 100%, linear-gradient(180deg, rgba(20,50,48,.55) 0 2px, transparent 2px) 0 0 / 100% 47%; }
.wr-studs { position: absolute; inset: 0; background: radial-gradient(circle .35cqw, #d8e6e3 70%, transparent 75%) -.2cqw 2.5% / 33.33% 47%; opacity: .7; }
.wr-sheen { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.12) 24%, transparent 30%), linear-gradient(115deg, transparent 58%, rgba(255,255,255,.08) 62%, transparent 70%); }
.wr-reflect { position: absolute; left: 6%; right: 6%; top: 56%; height: 24%; background: linear-gradient(90deg, transparent 0 8%, rgba(20,40,40,.25) 8% 9%, transparent 9% 40%, rgba(20,40,40,.25) 40% 41%, transparent 41%), linear-gradient(180deg, rgba(200,240,235,.18), transparent); filter: blur(2px); }
.wr-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 13%; background: linear-gradient(180deg, #6f8784, #3b4b4a 60%, #2a3433); box-shadow: 0 -2px 0 rgba(255,255,255,.15); }
.wr-tv { position: absolute; left: 36%; top: 13%; width: 58%; aspect-ratio: 16 / 9; background: #0d0f12; border-radius: .5cqw; padding: .7%; box-shadow: 0 1.6cqw 3cqw rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12); }
.wr-display { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: .2cqw; background: #fff; container-type: inline-size; }
.wr-display::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(120deg, rgba(255,255,255,.18), transparent 35%); }
.wr-slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
.wr-slide.on { opacity: 1; }
.wr-logo { position: absolute; left: 5%; top: 7%; z-index: 2; display: flex; align-items: center; gap: 1.2cqw; font-weight: 600; font-size: 3cqw; color: #1f2430; transition: color .4s; }
.wr-logo svg { width: 4.2cqw; }
.wr-logo .wr-heart { fill: #1f2430; transition: fill .4s; }
.wr-logo .wr-pulse { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linejoin: round; }
.wr-logo.is-light { color: #fff; }
.wr-logo.is-light .wr-heart { fill: #fff; }
.wr-logo.is-light .wr-pulse { stroke: #0b5470; }
.wr-s1 { background: linear-gradient(135deg, #f7f9fa, #e7f0f1); }
.wr-hello { position: absolute; left: 5%; top: 23%; width: 52%; color: #1f2430; }
.wr-hello small { font-size: 2.3cqw; letter-spacing: .14em; text-transform: uppercase; color: #0f8aa3; font-weight: 600; }
.wr-greet { margin: 1.5% 0 0; font-size: 7cqw; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
.wr-clock { font-size: 11cqw; font-weight: 300; line-height: 1.05; color: #0f8aa3; letter-spacing: -.02em; }
.wr-msg { margin: 2% 0 0; font-size: 2.6cqw; line-height: 1.4; color: #4a5563; max-width: 92%; }
.wr-cards { position: absolute; right: 5%; top: 9%; bottom: 9%; width: 36%; display: flex; flex-direction: column; gap: 2.4cqw; }
.wr-card { background: #fff; border-radius: 2cqw; padding: 2.6cqw 3cqw; box-shadow: 0 1cqw 3cqw rgba(15,60,70,.12); font-size: 2.4cqw; color: #1f2430; }
.wr-card-h { margin: 0 0 1.2cqw; font-size: 2cqw; letter-spacing: .14em; text-transform: uppercase; color: #6b7686; font-weight: 600; }
.wr-row { display: flex; justify-content: space-between; padding: 1cqw 0; border-top: 1px solid #e7ecef; }
.wr-row b { color: #0f8aa3; }
.wr-card-teal { flex: 1; background: linear-gradient(135deg, #1aa3b8, #0b6f8a); color: #fff; }
.wr-card-teal .wr-card-h { color: rgba(255,255,255,.8); }
.wr-card-teal .wr-card-p { font-size: 2.6cqw; }
.wr-card-teal b { display: block; font-size: 5cqw; line-height: 1.1; }
.wr-s2 { background: linear-gradient(135deg, #0b3d55, #0b6f8a); color: #fff; }
.wr-now { position: absolute; left: 5%; top: 24%; width: 52%; }
.wr-now small { font-size: 2.4cqw; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
.wr-ticket { font-size: 15cqw; font-weight: 800; line-height: 1; margin: 1% 0; animation: wr-flash 1.2s ease-in-out 3; }
.wr-room { font-size: 4cqw; font-weight: 600; display: flex; align-items: center; gap: 2cqw; }
.wr-room b { background: #28c76f; color: #06321b; padding: .3cqw 2cqw; border-radius: .8cqw; }
.wr-next { position: absolute; right: 5%; top: 24%; width: 33%; background: rgba(255,255,255,.1); border-radius: 1.5cqw; padding: 2.5cqw; }
.wr-next-h { margin: 0 0 1.5cqw; font-size: 2.2cqw; letter-spacing: .2em; text-transform: uppercase; opacity: .8; font-weight: 500; }
.wr-row2 { display: flex; justify-content: space-between; font-size: 3cqw; padding: 1cqw 0; border-top: 1px solid rgba(255,255,255,.15); }
.wr-wait { position: absolute; left: 0; right: 0; bottom: 0; padding: 2cqw 5%; background: rgba(0,0,0,.25); font-size: 2.4cqw; }
.wr-seats { position: absolute; display: flex; align-items: flex-end; }
.wr-front { left: 32%; right: -2%; bottom: 0; height: 27%; gap: 1%; }
.wr-far { left: 3%; width: 19%; bottom: 13%; height: 9%; gap: 2%; opacity: .9; }
.wr-seat { position: relative; flex: 1; height: 100%; }
.wr-back { position: absolute; left: 4%; right: 4%; top: 0; height: 52%; border-radius: 1.2cqw 1.2cqw .4cqw .4cqw; background: linear-gradient(180deg, #4a4f57, #2c3036); box-shadow: inset 0 .3cqw 0 rgba(255,255,255,.12); }
.wr-pan { position: absolute; left: 0; right: 0; top: 50%; height: 14%; border-radius: .4cqw .4cqw 1cqw 1cqw; background: linear-gradient(180deg, #3d4148, #1f2227); }
.wr-arm { position: absolute; top: 36%; width: 4%; height: 32%; background: #9aa2a8; border-radius: .3cqw; }
.wr-arm.l { left: -3%; } .wr-arm.r { right: -3%; }
.wr-far .wr-arm { display: none; }
.wr-leg { position: absolute; left: 45%; width: 10%; top: 64%; bottom: 0; background: linear-gradient(90deg, #6f777d, #b9c0c4, #6f777d); }
.wr-beam { position: absolute; left: 0; right: 0; top: 66%; height: 4%; background: #8b9398; }
@keyframes wr-flash { 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  .mk *, .mk *::before, .mk *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<figure class="mk" role="img" aria-label="Mockup: a wall-mounted digital display in a clinic waiting room, switching between a welcome screen and patient calling">
<div class="ms-scene wr" data-scene="wr" data-caption="Clinic waiting room">
  <div class="wr-ceiling"><i style="left:8%"></i><i style="left:34%"></i><i style="left:60%"></i><i style="left:86%"></i></div>
  <div class="wr-corridor"><div class="wr-exit"></div></div>
  <div class="wr-wall"><div class="wr-sheen"></div><div class="wr-reflect"></div><div class="wr-grid"></div><div class="wr-studs"></div></div>
  <div class="wr-floor"></div>
  <div class="wr-tv"><div class="wr-display">
    <div class="wr-logo">
      <svg viewBox="0 0 40 34"><path class="wr-heart" d="M20 32S2 21 2 10a9 9 0 0 1 18-2 9 9 0 0 1 18 2c0 11-18 22-18 22z"/><path class="wr-pulse" d="M6 16h8l3-5 4 10 3-5h10"/></svg>
      <span>CarePoint Health</span>
    </div>
    <section class="wr-slide wr-s1 on">
      <div class="wr-hello">
        <small class="wr-date">Thursday 2 October</small>
        <div class="wr-greet">Good morning</div>
        <div class="wr-clock">09:41</div>
        <div class="wr-msg">Please check in at reception. We'll call you on this screen.</div>
      </div>
      <div class="wr-cards">
        <div class="wr-card"><div class="wr-card-h">Today's clinics</div>
          <div class="wr-row"><span>Blood tests</span><b>Room 2</b></div>
          <div class="wr-row"><span>Physiotherapy</span><b>Room 5</b></div>
          <div class="wr-row"><span>Travel vaccines</span><b>Room 1</b></div>
        </div>
        <div class="wr-card wr-card-teal"><div class="wr-card-h">Pharmacy</div><div class="wr-card-p">Open today until</div><b>18:00</b></div>
      </div>
    </section>
    <section class="wr-slide wr-s2">
      <div class="wr-now">
        <small>Now calling</small>
        <div class="wr-ticket">A042</div>
        <div class="wr-room">Please go to <b>Room 3</b></div>
      </div>
      <div class="wr-next">
        <div class="wr-next-h">Up next</div>
        <div class="wr-row2"><span>A043</span><span>Room 1</span></div>
        <div class="wr-row2"><span>B017</span><span>Nurse</span></div>
        <div class="wr-row2"><span>A044</span><span>Room 3</span></div>
      </div>
      <div class="wr-wait">Average wait today: <b>12 minutes</b> · Thank you for your patience</div>
    </section>
  </div></div>
  <div class="wr-seats wr-far"></div>
  <div class="wr-seats wr-front"></div>
</div>
</figure>

<script>
(function () {
  var root = document.querySelector(".mk .ms-scene");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function pad(n) { return (n < 10 ? "0" : "") + n; }

function waitingRoom(el) {
  [[".wr-front", 5], [".wr-far", 4]].forEach(function (r) {
    var html = '<div class="wr-beam"></div>';
    for (var i = 0; i < r[1]; i++) html += '<div class="wr-seat"><div class="wr-leg"></div><div class="wr-back"></div><div class="wr-pan"></div><div class="wr-arm l"></div><div class="wr-arm r"></div></div>';
    el.querySelector(r[0]).innerHTML = html;
  });
  var slides = el.querySelectorAll(".wr-slide"), logo = el.querySelector(".wr-logo"), ticket = el.querySelector(".wr-ticket"), T = [];
  function show(n) {
    for (var j = 0; j < slides.length; j++) slides[j].classList.toggle("on", j === n);
    logo.classList.toggle("is-light", n === 1);
    if (n === 1) { ticket.style.animation = "none"; void ticket.offsetWidth; ticket.style.animation = ""; }
  }
  function clock() {
    var d = new Date(), h = d.getHours();
    el.querySelector(".wr-greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    el.querySelector(".wr-clock").textContent = pad(h) + ":" + pad(d.getMinutes());
    el.querySelector(".wr-date").textContent = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  }
  return {
    enter: function () { clock(); show(0); T.push(setTimeout(function () { show(1); }, 3800)); T.push(setInterval(clock, 15000)); },
    leave: function () { T.forEach(clearTimeout); T = []; }
  };
}

  var scene = waitingRoom(root);
  scene.enter();
  setInterval(function () { scene.leave(); scene.enter(); }, 8000); // replay the sequence
})();
</script>
</body>
</html>
