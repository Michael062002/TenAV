<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Your Project | TenAV</title>
  <meta name="description" content="Tell TenAV about your project and our team will be in touch.">
  <style>
    /* Theme: change these to match the TenAV brand */
    :root {
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --field-bg: #ffffff;
      --card-bg: #ffffff;
      --page-bg: #f1f5f9;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .lead-card {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .lead-card h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .lead-intro {
      margin: 0 0 32px;
      color: var(--muted);
    }

    .lead-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field { display: flex; flex-direction: column; min-width: 0; }
    .field--full { grid-column: 1 / -1; }

    .field label {
      margin-bottom: 6px;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .field .optional {
      font-weight: 400;
      color: var(--muted);
    }

    .field input,
    .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field textarea {
      min-height: 160px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .field [aria-invalid="true"] { border-color: var(--error); }
    .field [aria-invalid="true"]:focus {
      border-color: var(--error);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--error) 20%, transparent);
    }

    .field-error {
      margin-top: 6px;
      font-size: 0.875rem;
      color: var(--error);
    }
    .field-error:empty { display: none; }

    /* Honeypot: hidden from people, tempting to bots */
    .hp {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .lead-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 28px;
    }

    .privacy-note {
      margin: 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 12px 28px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .submit-btn:hover { background: var(--accent-hover); }
    .submit-btn:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
      outline-offset: 2px;
    }
    .submit-btn[disabled] { opacity: 0.7; cursor: wait; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .is-sending .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .form-alert {
      margin-bottom: 24px;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.9375rem;
      color: var(--error);
      background: var(--error-bg);
      border: 1px solid color-mix(in srgb, var(--error) 25%, transparent);
    }
    .form-alert a { color: inherit; }

    .lead-success {
      padding: 24px;
      border-radius: var(--radius);
      background: var(--success-bg);
      border: 1px solid color-mix(in srgb, var(--success) 25%, transparent);
    }
    .lead-success:focus { outline: none; }
    .lead-success h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      color: var(--success);
    }
    .lead-success p { margin: 0; }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .lead-card { padding: 24px 20px; border-radius: 12px; }
      .lead-card h1 { font-size: 1.5rem; }
      .lead-grid { grid-template-columns: 1fr; gap: 18px; }
      .submit-btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="lead-card">
    <h1>Start your project</h1>
    <p class="lead-intro">Tell us a little about yourself and what you have in mind, and our team will get back to you.</p>

    <!--
      Submissions are emailed to info@tenav.co.uk via FormSubmit (https://formsubmit.co).
      The action attribute is the no-JavaScript fallback; data-endpoint is used for the in-page submit.
      See README.md for the one-time activation step.
    -->
    <form id="lead-form"
          action="https://formsubmit.co/info@tenav.co.uk"
          data-endpoint="https://formsubmit.co/ajax/info@tenav.co.uk"
          method="POST">

      <div class="form-alert" id="form-alert" role="alert" hidden></div>

      <input type="hidden" name="_subject" value="New project enquiry from the TenAV website">
      <input type="hidden" name="_template" value="table">

      <div class="hp" aria-hidden="true">
        <label for="hp-field">Leave this field empty</label>
        <input type="text" id="hp-field" name="_honey" tabindex="-1" autocomplete="off">
      </div>

      <div class="lead-grid">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="First Name" type="text" autocomplete="given-name"
                 required maxlength="100" aria-describedby="first-name-error">
          <p class="field-error" id="first-name-error"></p>
        </div>

        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="Last Name" type="text" autocomplete="family-name"
                 required maxlength="100" aria-describedby="last-name-error">
          <p class="field-error" id="last-name-error"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="Email" type="email" autocomplete="email" inputmode="email"
                 required maxlength="254" aria-describedby="email-error">
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="field">
          <label for="phone">Phone <span class="optional">(optional)</span></label>
          <input id="phone" name="Phone" type="tel" autocomplete="tel" inputmode="tel"
                 maxlength="30" aria-describedby="phone-error">
          <p class="field-error" id="phone-error"></p>
        </div>

        <div class="field field--full">
          <label for="company">Company name <span class="optional">(optional)</span></label>
          <input id="company" name="Company" type="text" autocomplete="organization"
                 maxlength="150" aria-describedby="company-error">
          <p class="field-error" id="company-error"></p>
        </div>

        <div class="field field--full">
          <label for="project">Tell us about your project</label>
          <textarea id="project" name="Project Details" required maxlength="5000"
                    placeholder="What are you looking to achieve? Include the type of space, timescales and budget if you know them."
                    aria-describedby="project-error"></textarea>
          <p class="field-error" id="project-error"></p>
        </div>
      </div>

      <div class="lead-footer">
        <p class="privacy-note">We'll only use your details to respond to your enquiry.</p>
        <button type="submit" class="submit-btn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="submit-label">Send enquiry</span>
        </button>
      </div>
    </form>

    <div class="lead-success" id="lead-success" tabindex="-1" role="status" hidden>
      <h2>Thanks, we've got it</h2>
      <p id="lead-success-text">Your enquiry has been sent to our team and we'll be in touch soon.</p>
    </div>
  </main>

  <script>
    (function () {
      var form = document.getElementById('lead-form');
      if (!form || !window.fetch) return; // fall back to a plain form post

      var alertBox = document.getElementById('form-alert');
      var successBox = document.getElementById('lead-success');
      var successText = document.getElementById('lead-success-text');
      var button = form.querySelector('.submit-btn');
      var buttonLabel = form.querySelector('.submit-label');
      var endpoint = form.getAttribute('data-endpoint');

      // We show our own messages instead of the browser's validation bubbles
      form.noValidate = true;

      var fields = {
        firstName: document.getElementById('first-name'),
        lastName: document.getElementById('last-name'),
        email: document.getElementById('email'),
        phone: document.getElementById('phone'),
        company: document.getElementById('company'),
        project: document.getElementById('project')
      };

      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      var PHONE_RE = /^\+?[\d\s()\-.]{7,30}$/;

      function validate(input) {
        var value = input.value.trim();
        switch (input.id) {
          case 'first-name':
            return value ? '' : 'Please enter your first name.';
          case 'last-name':
            return value ? '' : 'Please enter your last name.';
          case 'email':
            if (!value) return 'Please enter your email address.';
            return EMAIL_RE.test(value) ? '' : 'Please enter a valid email address, like name@company.co.uk.';
          case 'phone':
            if (!value) return '';
            return PHONE_RE.test(value) && value.replace(/\D/g, '').length >= 7
              ? '' : 'Please enter a valid phone number.';
          case 'project':
            return value ? '' : 'Please tell us a little about your project.';
          default:
            return '';
        }
      }

      function showError(input, message) {
        var errorEl = document.getElementById(input.id + '-error');
        errorEl.textContent = message;
        if (message) input.setAttribute('aria-invalid', 'true');
        else input.removeAttribute('aria-invalid');
      }

      // Re-check a field once the person has moved on from it, and clear errors as they fix them
      Object.keys(fields).forEach(function (key) {
        var input = fields[key];
        input.addEventListener('blur', function () {
          if (input.value.trim() || input.hasAttribute('aria-invalid')) showError(input, validate(input));
        });
        input.addEventListener('input', function () {
          if (input.hasAttribute('aria-invalid')) showError(input, validate(input));
        });
      });

      function setSending(sending) {
        button.disabled = sending;
        button.classList.toggle('is-sending', sending);
        buttonLabel.textContent = sending ? 'Sending…' : 'Send enquiry';
      }

      function showAlert(html) {
        alertBox.innerHTML = html;
        alertBox.hidden = false;
      }

      function showSuccess() {
        var name = fields.firstName.value.trim();
        if (name) {
          successBox.querySelector('h2').textContent = 'Thanks, ' + name + ', we\'ve got it';
        }
        form.hidden = true;
        successBox.hidden = false;
        successBox.focus();
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        alertBox.hidden = true;

        var firstInvalid = null;
        Object.keys(fields).forEach(function (key) {
          var input = fields[key];
          var message = validate(input);
          showError(input, message);
          if (message && !firstInvalid) firstInvalid = input;
        });
        if (firstInvalid) {
          firstInvalid.focus();
          return;
        }

        // Bots fill the honeypot; quietly pretend it worked
        if (form.elements['_honey'].value) {
          showSuccess();
          return;
        }

        var payload = {};
        new FormData(form).forEach(function (value, key) {
          payload[key] = typeof value === 'string' ? value.trim() : value;
        });

        var fullName = (payload['First Name'] + ' ' + payload['Last Name']).trim();
        payload._subject = 'New project enquiry: ' + fullName + (payload['Company'] ? ' (' + payload['Company'] + ')' : '');
        payload._replyto = payload['Email'];

        setSending(true);

        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (response) {
            return response.json().catch(function () { return {}; }).then(function (data) {
              if (response.ok && String(data.success) === 'true') return data;
              throw new Error(data.message || 'Request failed with status ' + response.status);
            });
          })
          .then(function () {
            showSuccess();
          })
          .catch(function (error) {
            console.error('Lead form submission failed:', error);
            showAlert('Sorry, something went wrong sending your enquiry. Please try again, or email us directly at <a href="mailto:info@tenav.co.uk">info@tenav.co.uk</a>.');
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
          })
          .finally(function () {
            setSending(false);
          });
      });
    })();
  </script>
</body>
</html>
