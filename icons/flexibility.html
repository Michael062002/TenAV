<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexibility Icon</title>
<style>
  :root{ --stroke:#1a1a1a; --bg:#ffffff; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
  }
  .icon-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .icon-card svg{
    width:140px;
    height:140px;
  }
  .icon-card svg *{
    fill:none;
    stroke:var(--stroke);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-card .label{
    font-size:16px;
    font-weight:600;
    color:var(--stroke);
    text-align:center;
    line-height:1.3;
  }
</style>
</head>
<body>
  <div class="icon-card">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flexTitle">
      <title id="flexTitle">Flexibility</title>

      <!-- clock -->
      <circle cx="22" cy="20" r="9"/>
      <line x1="22" y1="9" x2="22" y2="11"/>
      <line x1="22" y1="20" x2="22" y2="14"/>
      <line x1="22" y1="20" x2="27" y2="22"/>

      <!-- calendar / document -->
      <rect x="42" y="9" width="16" height="16" rx="2"/>
      <line x1="46" y1="6" x2="46" y2="11"/>
      <line x1="54" y1="6" x2="54" y2="11"/>
      <line x1="45" y1="17" x2="55" y2="17"/>
      <line x1="45" y1="21" x2="55" y2="21"/>

      <!-- briefcase -->
      <rect x="70" y="15" width="16" height="12" rx="2"/>
      <path d="M75,15 v-4 a3,3 0 0 1 6,0 v4"/>
      <line x1="78" y1="15" x2="78" y2="27"/>

      <!-- person reaching up -->
      <circle cx="50" cy="55" r="7"/>
      <path d="M40,90 L44,68 Q50,63 56,68 L60,90"/>
      <line x1="45" y1="70" x2="25" y2="55"/>
      <line x1="55" y1="70" x2="75" y2="55"/>
    </svg>
    <div class="label">Flexibility</div>
  </div>
</body>
</html>
