<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexibility Icon</title>
<style>
  :root{
    --tenav-red:#E4002B;
    --ink:#1a1a1a;
    --card-bg:#ffffff;
    --card-border:#eaeaea;
    --shadow:0 2px 10px rgba(0,0,0,0.06);
    --shadow-hover:0 20px 44px rgba(228,0,43,0.18), 0 6px 14px rgba(0,0,0,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f5f6;
  }

  .icon-tile{
    position:relative;
    width:220px;
    height:220px;
    padding:32px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow);
    overflow:hidden;
    cursor:pointer;
    transition:transform .45s cubic-bezier(.22,1,.36,1),
               box-shadow .45s cubic-bezier(.22,1,.36,1),
               border-color .45s ease;
    animation:tileIn .6s cubic-bezier(.22,1,.36,1) both;
  }

  .icon-tile::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 42%, rgba(228,0,43,0.14), transparent 70%);
    opacity:0;
    transition:opacity .45s ease;
  }

  .icon-tile::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    width:0%;
    height:3px;
    background:var(--tenav-red);
    transform:translateX(-50%);
    transition:width .45s cubic-bezier(.22,1,.36,1);
    border-radius:3px 3px 0 0;
  }

  .icon-tile:hover{
    transform:translateY(-8px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(228,0,43,0.28);
  }
  .icon-tile:hover::before{ opacity:1; }
  .icon-tile:hover::after{ width:56%; }

  .icon-tile svg{
    width:96px;
    height:96px;
    position:relative;
    z-index:1;
    transition:transform .45s cubic-bezier(.22,1,.36,1);
  }
  .icon-tile:hover svg{ transform:scale(1.08); }

  .icon-tile svg *{
    fill:none;
    stroke:var(--ink);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    animation:draw 1.1s cubic-bezier(.22,1,.36,1) .15s forwards;
    transition:stroke .45s ease;
  }
  .icon-tile:hover svg *{ stroke:var(--tenav-red); }

  @keyframes tileIn{
    from{ opacity:0; transform:translateY(14px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }
</style>
</head>
<body>
  <div class="icon-tile">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flexTitle">
      <title id="flexTitle">Flexibility</title>

      <!-- clock -->
      <circle cx="13" cy="17" r="8"/>
      <line x1="13" y1="7" x2="13" y2="9"/>
      <line x1="13" y1="17" x2="13" y2="12"/>
      <line x1="13" y1="17" x2="17" y2="19"/>

      <!-- calendar / document -->
      <rect x="42" y="7" width="16" height="16" rx="2"/>
      <line x1="46" y1="4" x2="46" y2="9"/>
      <line x1="54" y1="4" x2="54" y2="9"/>
      <line x1="45" y1="15" x2="55" y2="15"/>
      <line x1="45" y1="19" x2="55" y2="19"/>

      <!-- briefcase -->
      <rect x="79" y="12" width="16" height="12" rx="2"/>
      <path d="M84,12 v-4 a3,3 0 0 1 6,0 v4"/>
      <line x1="87" y1="12" x2="87" y2="24"/>

      <!-- person reaching up -->
      <circle cx="50" cy="58" r="7"/>
      <path d="M40,92 L44,71 Q50,66 56,71 L60,92"/>
      <line x1="45" y1="73" x2="23" y2="56"/>
      <line x1="55" y1="73" x2="77" y2="56"/>
    </svg>
  </div>
</body>
</html>
