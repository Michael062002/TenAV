<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexibility Icon</title>
<style>
  :root{
    --tenav-red:#E4002B;
    --ink:#1a1a1a;
    --card-bg:#ffffff;
    --card-border:#eaeaea;
    --shadow:0 2px 10px rgba(0,0,0,0.06);
    --shadow-hover:0 20px 44px rgba(228,0,43,0.18), 0 6px 14px rgba(0,0,0,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f5f6;
  }

  .icon-tile{
    position:relative;
    width:180px;
    height:180px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow);
    overflow:hidden;
    cursor:pointer;
    transition:transform .45s cubic-bezier(.22,1,.36,1),
               box-shadow .45s cubic-bezier(.22,1,.36,1),
               border-color .45s ease;
    animation:tileIn .6s cubic-bezier(.22,1,.36,1) both;
  }

  .icon-tile::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 42%, rgba(228,0,43,0.14), transparent 70%);
    opacity:0;
    transition:opacity .45s ease;
  }

  .icon-tile::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    width:0%;
    height:3px;
    background:var(--tenav-red);
    transform:translateX(-50%);
    transition:width .45s cubic-bezier(.22,1,.36,1);
    border-radius:3px 3px 0 0;
  }

  .icon-tile:hover{
    transform:translateY(-8px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(228,0,43,0.28);
  }
  .icon-tile:hover::before{ opacity:1; }
  .icon-tile:hover::after{ width:56%; }

  .icon-tile svg{
    width:96px;
    height:96px;
    position:relative;
    z-index:1;
    transition:transform .45s cubic-bezier(.22,1,.36,1);
  }
  .icon-tile:hover svg{ transform:scale(1.08); }

  .icon-tile svg *{
    fill:none;
    stroke:var(--ink);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    animation:draw 1.1s cubic-bezier(.22,1,.36,1) .15s forwards;
    transition:stroke .45s ease;
  }
  .icon-tile:hover svg *{ stroke:var(--tenav-red); }

  @keyframes tileIn{
    from{ opacity:0; transform:translateY(14px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }
</style>
</head>
<body>
  <div class="icon-tile">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flexTitle">
      <title id="flexTitle">Flexibility</title>

      <!-- clock -->
      <circle cx="22" cy="20" r="9"/>
      <line x1="22" y1="9" x2="22" y2="11"/>
      <line x1="22" y1="20" x2="22" y2="14"/>
      <line x1="22" y1="20" x2="27" y2="22"/>

      <!-- calendar / document -->
      <rect x="42" y="9" width="16" height="16" rx="2"/>
      <line x1="46" y1="6" x2="46" y2="11"/>
      <line x1="54" y1="6" x2="54" y2="11"/>
      <line x1="45" y1="17" x2="55" y2="17"/>
      <line x1="45" y1="21" x2="55" y2="21"/>

      <!-- briefcase -->
      <rect x="70" y="15" width="16" height="12" rx="2"/>
      <path d="M75,15 v-4 a3,3 0 0 1 6,0 v4"/>
      <line x1="78" y1="15" x2="78" y2="27"/>

      <!-- person reaching up -->
      <circle cx="50" cy="55" r="7"/>
      <path d="M40,90 L44,68 Q50,63 56,68 L60,90"/>
      <line x1="45" y1="70" x2="25" y2="55"/>
      <line x1="55" y1="70" x2="75" y2="55"/>
    </svg>
  </div>
</body>
</html>
