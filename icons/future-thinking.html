<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Future Thinking Icon</title>
<style>
  :root{ --stroke:#1a1a1a; --bg:#ffffff; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
  }
  .icon-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .icon-card svg{
    width:140px;
    height:140px;
  }
  .icon-card svg *{
    fill:none;
    stroke:var(--stroke);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-card .label{
    font-size:16px;
    font-weight:600;
    color:var(--stroke);
    text-align:center;
    line-height:1.3;
  }
</style>
</head>
<body>
  <div class="icon-card">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="futureTitle">
      <title id="futureTitle">Future Thinking</title>

      <!-- bulb outline -->
      <path d="M35,55 C22,45 22,20 50,15 C78,20 78,45 65,55 C62,58 60,60 60,64 L40,64 C40,60 38,58 35,55 Z"/>

      <!-- brain folds inside the bulb -->
      <line x1="50" y1="22" x2="50" y2="55"/>
      <path d="M42,25 q-6,4 0,8 q-6,4 0,8 q-6,4 0,8"/>
      <path d="M58,25 q6,4 0,8 q6,4 0,8 q6,4 0,8"/>

      <!-- screw base -->
      <line x1="42" y1="68" x2="58" y2="68"/>
      <line x1="42" y1="73" x2="58" y2="73"/>
      <line x1="42" y1="78" x2="58" y2="78"/>
      <rect x="44" y="82" width="12" height="6" rx="2"/>
    </svg>
    <div class="label">Future<br>Thinking</div>
  </div>
</body>
</html>
