<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accessibility Icon</title>
<style>
  :root{ --stroke:#1a1a1a; --bg:#ffffff; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
  }
  .icon-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .icon-card svg{
    width:140px;
    height:140px;
  }
  .icon-card svg *{
    fill:none;
    stroke:var(--stroke);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-card .label{
    font-size:16px;
    font-weight:600;
    color:var(--stroke);
    text-align:center;
    line-height:1.3;
  }
</style>
</head>
<body>
  <div class="icon-card">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a11yTitle">
      <title id="a11yTitle">Accessibility</title>

      <!-- gear -->
      <circle cx="22" cy="24" r="7"/>
      <circle cx="22" cy="24" r="2.5"/>
      <line x1="29.5" y1="24" x2="32.5" y2="24"/>
      <line x1="27.3" y1="29.3" x2="29.4" y2="31.4"/>
      <line x1="22" y1="31.5" x2="22" y2="34.5"/>
      <line x1="16.7" y1="29.3" x2="14.6" y2="31.4"/>
      <line x1="14.5" y1="24" x2="11.5" y2="24"/>
      <line x1="16.7" y1="18.7" x2="14.6" y2="16.6"/>
      <line x1="22" y1="16.5" x2="22" y2="13.5"/>
      <line x1="27.3" y1="18.7" x2="29.4" y2="16.6"/>

      <!-- magnifying glass with person -->
      <circle cx="42" cy="50" r="14"/>
      <line x1="52" y1="60" x2="64" y2="72"/>
      <circle cx="42" cy="45" r="3.5"/>
      <path d="M35,58 q7,-9 14,0"/>

      <!-- tap / touch indicator -->
      <line x1="80" y1="26" x2="80" y2="32"/>
      <circle cx="80" cy="22" r="2"/>
      <path d="M85,17 a10,10 0 0 1 0,10"/>
      <path d="M75,17 a10,10 0 0 0 0,10"/>
    </svg>
    <div class="label">Accessibility</div>
  </div>
</body>
</html>
