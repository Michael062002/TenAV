<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accessibility Icon</title>
<style>
  :root{
    --tenav-red:#E4002B;
    --ink:#1a1a1a;
    --card-bg:#ffffff;
    --card-border:#eaeaea;
    --shadow:0 2px 10px rgba(0,0,0,0.06);
    --shadow-hover:0 20px 44px rgba(228,0,43,0.18), 0 6px 14px rgba(0,0,0,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f5f6;
  }

  .icon-tile{
    position:relative;
    width:220px;
    height:220px;
    padding:32px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow);
    overflow:hidden;
    cursor:pointer;
    transition:transform .45s cubic-bezier(.22,1,.36,1),
               box-shadow .45s cubic-bezier(.22,1,.36,1),
               border-color .45s ease;
    animation:tileIn .6s cubic-bezier(.22,1,.36,1) both;
  }

  .icon-tile::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 42%, rgba(228,0,43,0.14), transparent 70%);
    opacity:0;
    transition:opacity .45s ease;
  }

  .icon-tile::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    width:0%;
    height:3px;
    background:var(--tenav-red);
    transform:translateX(-50%);
    transition:width .45s cubic-bezier(.22,1,.36,1);
    border-radius:3px 3px 0 0;
  }

  .icon-tile:hover{
    transform:translateY(-8px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(228,0,43,0.28);
  }
  .icon-tile:hover::before{ opacity:1; }
  .icon-tile:hover::after{ width:56%; }

  .icon-tile svg{
    width:96px;
    height:96px;
    position:relative;
    z-index:1;
    transition:transform .45s cubic-bezier(.22,1,.36,1);
  }
  .icon-tile:hover svg{ transform:scale(1.08); }

  .icon-tile svg *{
    fill:none;
    stroke:var(--ink);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    animation:draw 1.1s cubic-bezier(.22,1,.36,1) .15s forwards;
    transition:stroke .45s ease;
  }
  .icon-tile:hover svg *{ stroke:var(--tenav-red); }

  @keyframes tileIn{
    from{ opacity:0; transform:translateY(14px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }
</style>
</head>
<body>
  <div class="icon-tile">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a11yTitle">
      <title id="a11yTitle">Accessibility</title>

      <!-- gear -->
      <circle cx="16" cy="18" r="7"/>
      <circle cx="16" cy="18" r="2.5"/>
      <line x1="24.5" y1="18" x2="27" y2="18"/>
      <line x1="22" y1="24" x2="23.8" y2="25.8"/>
      <line x1="16" y1="26.5" x2="16" y2="29"/>
      <line x1="10" y1="24" x2="8.2" y2="25.8"/>
      <line x1="7.5" y1="18" x2="5" y2="18"/>
      <line x1="10" y1="12" x2="8.2" y2="10.2"/>
      <line x1="16" y1="9.5" x2="16" y2="7"/>
      <line x1="22" y1="12" x2="23.8" y2="10.2"/>

      <!-- magnifying glass with person -->
      <circle cx="48" cy="58" r="15"/>
      <line x1="58" y1="68" x2="74" y2="84"/>
      <circle cx="48" cy="52" r="4"/>
      <path d="M40,66 q8,-10 16,0"/>

      <!-- tap / touch indicator -->
      <circle cx="84" cy="16" r="2"/>
      <line x1="84" y1="20" x2="84" y2="26"/>
      <path d="M89,11 a10,10 0 0 1 0,10"/>
      <path d="M79,11 a10,10 0 0 0 0,10"/>
    </svg>
  </div>
</body>
</html>
