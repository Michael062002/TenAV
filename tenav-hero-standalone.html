<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TenTechnology Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet" />
  <style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #101418;
  --ink-soft: #5b6472;
  --line: #e4e7ec;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.tenav-hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(1.5rem, 5vw, 3rem);
}

/* ---------- interactive artwork ---------- */

.hero-art-wrap {
  position: relative;
}

.hero-art {
  display: flex;
  align-items: stretch;
  width: 100%;
  border-radius: 4px;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.97);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.tenav-hero.in-view .hero-art {
  opacity: 1;
  transform: scale(1);
}

/* static brand lockup (logo + tagline), kept exactly as supplied */
.hero-logo {
  position: relative;
  flex: 0 0 41%;
  max-width: 41%;
  aspect-ratio: var(--logo-w) / var(--logo-h);
}

/* right edge cut at the same 12deg angle as the panels' own skew, so the
   white lockup ends on a diagonal instead of a vertical edge — kept on
   its own wrapper (rather than the image) so the recentring shift below
   doesn't drag the clip boundary along with it */
.hero-logo-clip {
  position: absolute;
  inset: 0;
  overflow: hidden;
  clip-path: polygon(0% 0%, 100% 0%, 86.73% 100%, 0% 100%);
}

.hero-logo-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  /* the source crop has far more empty margin on the right (reserved
     for the tick, which now renders separately) than the left — shift
     right to balance the margins and centre the wordmark */
  transform: translateX(9.37%);
}

/* matches the exact crop window of hero-logo-img (same original-document
   coordinate space) for a true natural position relative to the logo
   text, nudged right slightly so it touches the panel with no gap —
   the panels here are a separate photo composition, not derived from
   the original document, so a small manual nudge is still needed */
.hero-tick-clip {
  position: absolute;
  inset: 0;
  transform: translateX(18%);
  z-index: 5;
  pointer-events: none;
}

/* the tick draws in (top to bottom) once the hero enters the viewport */
.hero-tick {
  display: block;
  width: 100%;
  height: 100%;
  clip-path: inset(0 0 100% 0);
  transition: clip-path 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
}

.tenav-hero.in-view .hero-tick {
  clip-path: inset(0 0 0% 0);
}

/* interactive service panels — real flex items, so hovering one actually
   grows its width and shrinks its neighbours, not an overlay on top */
.hero-panels {
  flex: 1 1 auto;
  display: flex;
  overflow: hidden;
  /* pulls the row left by a % of the *whole* hero-art width so it always
     meets the tick's true edge, regardless of viewport size (a fixed px
     value here would drift out of alignment as the hero scales) */
  margin-left: -1%;
  margin-right: -28px;
}

.hero-panel {
  position: relative;
  flex: 1 1 0%;
  min-width: 0;
  overflow: hidden;
  background: #11151a;
  border-left: 5px solid rgba(255, 255, 255, 0.9);
  transform: skewX(-12deg);
  margin-left: -28px;
  cursor: pointer;
  text-decoration: none;
  outline: none;
  transition: flex-grow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.hero-panel:first-child {
  margin-left: 0;
}

/* photograph, oversized so its counter-skew never exposes a corner, plus
   a bottom-weighted scrim so the label stays legible over any photo */
.hero-panel-bg {
  position: absolute;
  inset: -10% -35%;
  transform: skewX(12deg);
}

.hero-panel-bg picture,
.hero-panel-bg img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-panel-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10, 12, 16, 0.15) 0%, rgba(10, 12, 16, 0.6) 100%);
}

.hero-panel-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--brand);
  mix-blend-mode: multiply;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.hero-panel-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 0.45rem;
  padding: 0 1.5rem;
  transform: skewX(12deg);
}

.hero-label {
  display: block;
  min-width: 0;
  max-width: 100%;
}

.brand-logo {
  display: block;
  height: clamp(1.1rem, 3.4vw, 2.1rem);
  width: auto;
  max-width: 100%;
  filter: drop-shadow(0 1px 8px rgba(0, 0, 0, 0.35));
}

/* logos stay plain white — it's the tick that picks up the hovered
   panel's brand colour instead (see below) */
.brand-logo path,
.brand-logo polygon,
.brand-logo text,
.brand-logo tspan {
  fill: #fff !important;
}

/* description + CTA live inside the panel itself and only take up space
   once the panel has expanded and there's room for them — no floating
   tooltip */
.hero-panel-desc,
.hero-panel-cta {
  max-width: 220px;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.3s ease, max-height 0.3s ease;
}

.hero-panel-desc {
  font-size: 0.8rem;
  line-height: 1.35;
  color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
}

.hero-panel-cta {
  font-size: 0.82rem;
  font-weight: 700;
  color: #fff;
}

.hero-panel:hover,
.hero-panel:focus-visible,
.hero-panel.is-active {
  flex-grow: 2.1;
  z-index: 2;
}

.hero-panel:hover .hero-panel-bg::after,
.hero-panel:focus-visible .hero-panel-bg::after,
.hero-panel.is-active .hero-panel-bg::after {
  opacity: 0.6;
}

.hero-panel:hover .brand-logo,
.hero-panel:focus-visible .brand-logo,
.hero-panel.is-active .brand-logo {
  filter: drop-shadow(0 1px 12px rgba(0, 0, 0, 0.55));
}

/* the logo's own accent shape (the "tick" in AV/Unify, "Ten" in
   Signage) is what picks up the brand colour on hover — the rest of the
   wordmark, and the separate master tick by the main logo, stay as-is */
.tenav-blue,
.tenunify-yellow,
.tensignage-green {
  transition: fill 0.35s ease;
}

.hero-panel:hover .tenav-blue,
.hero-panel:focus-visible .tenav-blue,
.hero-panel.is-active .tenav-blue,
.hero-panel:hover .tenunify-yellow,
.hero-panel:focus-visible .tenunify-yellow,
.hero-panel.is-active .tenunify-yellow,
.hero-panel:hover .tensignage-green,
.hero-panel:focus-visible .tensignage-green,
.hero-panel.is-active .tensignage-green {
  fill: var(--brand) !important;
}

.hero-panel:hover .hero-panel-desc,
.hero-panel:focus-visible .hero-panel-desc,
.hero-panel.is-active .hero-panel-desc,
.hero-panel:hover .hero-panel-cta,
.hero-panel:focus-visible .hero-panel-cta,
.hero-panel.is-active .hero-panel-cta {
  opacity: 1;
  max-height: 100px;
}

.hero-panel:focus-visible {
  box-shadow: inset 0 0 0 3px var(--brand);
}

/* ---------- responsive ---------- */

@media (max-width: 640px) {
  .hero-art {
    flex-direction: column;
    border-radius: 2px;
  }

  .hero-logo {
    flex-basis: auto;
    max-width: none;
    width: 100%;
  }

  .hero-logo-clip {
    clip-path: none;
  }

  .hero-logo-img {
    /* the desktop recentring shift relies on the diagonal clip to
       absorb the overflow; without it here it would cut off "Company" */
    transform: none;
  }

  .hero-tick-clip {
    transform: none;
  }

  .hero-panels {
    flex-direction: column;
    margin-left: 0;
    margin-right: 0;
  }

  .hero-panel {
    flex: none;
    min-height: 3.6rem;
    transform: none;
    margin-left: 0;
    border-left: none;
    border-top: 4px solid #fff;
  }

  .hero-panel:first-child {
    margin-left: 0;
  }

  .hero-panel-bg {
    inset: 0;
    transform: none;
  }

  .hero-panel-inner {
    padding: 0.75rem 1.25rem;
    justify-content: center;
    transform: none;
  }

  .hero-panel:hover,
  .hero-panel:focus-visible,
  .hero-panel.is-active {
    flex-grow: 0;
    min-height: 7.5rem;
  }

  .brand-logo {
    height: 1.6rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .hero-art,
  .hero-tick {
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
    clip-path: inset(0 0 0% 0) !important;
  }

  .hero-panel,
  .hero-panel-desc,
  .hero-panel-cta,
  .tenav-blue,
  .tenunify-yellow,
  .tensignage-green {
    transition: none !important;
  }
}

</style>

  <script>
(function () {
  "use strict";

  var hero = document.getElementById("hero");
  var art = document.getElementById("heroArt");
  var panels = Array.prototype.slice.call(art.querySelectorAll(".hero-panel"));

  var isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches;

  // ---- entrance animation ----
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            hero.classList.add("in-view");
            io.disconnect();
          }
        });
      },
      { threshold: 0.25 }
    );
    io.observe(hero);
  } else {
    hero.classList.add("in-view");
  }

  // ---- touch: first tap expands + reveals the CTA, second tap follows the link ----
  if (isTouch) {
    panels.forEach(function (panel) {
      panel.addEventListener("click", function (event) {
        if (!panel.classList.contains("is-active")) {
          event.preventDefault();
          panels.forEach(function (p) {
            if (p !== panel) p.classList.remove("is-active");
          });
          panel.classList.add("is-active");
        }
        // second tap on an already-active panel follows the link normally
      });
    });

    document.addEventListener(
      "click",
      function (event) {
        if (!art.contains(event.target)) {
          panels.forEach(function (p) {
            p.classList.remove("is-active");
          });
        }
      },
      true
    );

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        panels.forEach(function (p) {
          p.classList.remove("is-active");
        });
      }
    });
  }
})();

</script>
