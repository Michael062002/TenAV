<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TenTechnology Group</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #101418;
  --ink-soft: #5b6472;
  --line: #e4e7ec;
  --panel: #f4f5f7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.tenav-hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(1.5rem, 5vw, 3rem);
}

/* ---------- interactive artwork ---------- */

.hero-art-wrap {
  position: relative;
}

.hero-art {
  display: flex;
  align-items: stretch;
  width: 100%;
  border-radius: 4px;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.97);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.tenav-hero.in-view .hero-art {
  opacity: 1;
  transform: scale(1);
}

/* static brand lockup (logo + tagline), kept exactly as supplied */
.hero-logo {
  position: relative;
  flex: 0 0 45%;
  max-width: 45%;
  aspect-ratio: var(--logo-w) / var(--logo-h);
}

.hero-logo-img,
.hero-tick {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

/* the tick draws in (top to bottom) once the hero enters the viewport */
.hero-tick {
  clip-path: inset(0 0 100% 0);
  transition: clip-path 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
}

.tenav-hero.in-view .hero-tick {
  clip-path: inset(0 0 0% 0);
}

/* interactive service panels — real flex items, so hovering one actually
   grows its width and shrinks its neighbours, not an overlay on top */
.hero-panels {
  flex: 1 1 auto;
  display: flex;
  overflow: hidden;
  margin-right: -28px;
}

.hero-panel {
  position: relative;
  flex: 1 1 0%;
  min-width: 0;
  overflow: hidden;
  background: var(--panel);
  border-left: 1px solid var(--line);
  transform: skewX(-12deg);
  margin-left: -28px;
  cursor: pointer;
  text-decoration: none;
  outline: none;
  transition: flex-grow 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.35s ease,
    border-color 0.35s ease;
}

.hero-panel:first-child {
  margin-left: -10px;
}

.hero-panel-inner {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1.5rem;
  transform: skewX(12deg);
}

.hero-label {
  min-width: 0;
  max-width: 100%;
  font-weight: 800;
  font-size: clamp(0.85rem, 1.8vw, 1.35rem);
  letter-spacing: -0.01em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.3s ease;
}

.hero-panel:hover,
.hero-panel:focus-visible,
.hero-panel.is-active {
  flex-grow: 1.35;
  z-index: 2;
  background: color-mix(in srgb, var(--brand) 10%, var(--panel));
  border-left-color: var(--brand);
}

.hero-panel:hover .hero-label,
.hero-panel:focus-visible .hero-label,
.hero-panel.is-active .hero-label {
  color: var(--brand);
}

.hero-panel:focus-visible {
  box-shadow: inset 0 0 0 3px var(--brand);
}

/* ---------- tooltip / description reveal ---------- */

.hero-tooltip {
  position: absolute;
  z-index: 5;
  width: max-content;
  max-width: 230px;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  background: #101418;
  color: #fff;
  box-shadow: 0 14px 34px rgba(16, 20, 24, 0.28);
  opacity: 0;
  transform: translate(-50%, -6px) scale(0.96);
  transform-origin: bottom center;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.hero-tooltip.is-visible {
  opacity: 1;
  transform: translate(-50%, -14px) scale(1);
}

.tooltip-name {
  margin: 0 0 0.25rem;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--brand, #fff);
}

.tooltip-desc {
  margin: 0 0 0.6rem;
  font-size: 0.82rem;
  line-height: 1.4;
  color: #d7dbe0;
}

.tooltip-link {
  pointer-events: none;
  font-size: 0.82rem;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
}

.hero-tooltip.is-visible .tooltip-link {
  pointer-events: auto;
}

.tooltip-link:hover {
  text-decoration: underline;
}

/* ---------- responsive ---------- */

@media (max-width: 640px) {
  .hero-art {
    flex-direction: column;
    border-radius: 2px;
  }

  .hero-logo {
    flex-basis: auto;
    max-width: none;
    width: 100%;
  }

  .hero-panels {
    flex-direction: column;
    margin-right: 0;
  }

  .hero-panel {
    flex: none;
    min-height: 3.1rem;
    transform: none;
    margin-left: 0;
    border-left: none;
    border-top: 1px solid var(--line);
  }

  .hero-panel:first-child {
    margin-left: 0;
    border-top: none;
  }

  .hero-panel-inner {
    padding: 0 1.25rem;
    justify-content: flex-start;
    transform: none;
  }

  .hero-panel:hover,
  .hero-panel:focus-visible,
  .hero-panel.is-active {
    flex-grow: 0;
    min-height: 3.6rem;
  }

  .hero-label {
    font-size: 1.05rem;
  }

  .hero-tooltip {
    max-width: 180px;
    font-size: 0.92em;
  }
}

@media (prefers-reduced-motion: reduce) {
  .hero-art,
  .hero-tick {
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
    clip-path: inset(0 0 0% 0) !important;
  }

  .hero-panel {
    transition: none !important;
  }

  .hero-tooltip {
    transition: opacity 0.01s linear !important;
  }
}

</style>

        <div class="hero-panels">
          <a
            class="hero-panel"
            data-id="install"
            data-name="TenAV"
            data-description="AV design, installation and integration for meeting rooms, offices and venues."
            href="#tenav"
            aria-label="TenAV — AV design, installation and integration. Explore this service."
            style="--brand:#EE2F2F"
          >
            <span class="hero-panel-inner"><span class="hero-label">TenAV</span></span>
          </a>
          <a
            class="hero-panel"
            data-id="signage"
            data-name="TenSignage"
            data-description="Digital signage and menu boards that keep customers informed and engaged."
            href="#tensignage"
            aria-label="TenSignage — digital signage and menu boards. Explore this service."
            style="--brand:#2BA6A6"
          >
            <span class="hero-panel-inner"><span class="hero-label">TenSignage</span></span>
          </a>
          <a
            class="hero-panel"
            data-id="unify"
            data-name="TenUnify"
            data-description="Unified IT and communications that keep every device and workspace connected."
            href="#tenunify"
            aria-label="TenUnify — unified IT and communications. Explore this service."
            style="--brand:#B96E36"
          >
            <span class="hero-panel-inner"><span class="hero-label">TenUnify</span></span>
          </a>
        </div>

      <div class="hero-tooltip" id="heroTooltip" role="status" aria-live="polite">
        <p class="tooltip-name" id="tooltipName"></p>
        <p class="tooltip-desc" id="tooltipDesc"></p>
        <a class="tooltip-link" id="tooltipLink" href="#">Explore <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>

<script>
(function () {
  "use strict";

  var hero = document.getElementById("hero");
  var art = document.getElementById("heroArt");
  var panels = Array.prototype.slice.call(art.querySelectorAll(".hero-panel"));
  var tooltip = document.getElementById("heroTooltip");
  var tooltipName = document.getElementById("tooltipName");
  var tooltipDesc = document.getElementById("tooltipDesc");
  var tooltipLink = document.getElementById("tooltipLink");

  var isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches;
  var activePanel = null;

  // ---- entrance animation ----
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            hero.classList.add("in-view");
            io.disconnect();
          }
        });
      },
      { threshold: 0.25 }
    );
    io.observe(hero);
  } else {
    hero.classList.add("in-view");
  }

  // ---- description reveal ----
  function showTooltip(panel) {
    tooltipName.textContent = panel.dataset.name;
    tooltipDesc.textContent = panel.dataset.description;
    tooltipLink.href = panel.getAttribute("href");
    tooltipLink.textContent = "";
    tooltipLink.append("Explore " + panel.dataset.name + " ");
    var arrow = document.createElement("span");
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "→";
    tooltipLink.append(arrow);
    tooltip.style.setProperty("--brand", getComputedStyle(panel).getPropertyValue("--brand"));

    var artRect = art.getBoundingClientRect();
    var panelRect = panel.getBoundingClientRect();
    var x = panelRect.left + panelRect.width / 2 - artRect.left;
    var minX = 120;
    var maxX = artRect.width - 120;
    x = Math.max(minX, Math.min(maxX, x));

    tooltip.style.left = x + "px";
    tooltip.style.top = panelRect.top - artRect.top + "px";
    tooltip.classList.add("is-visible");

    if (activePanel && activePanel !== panel) {
      activePanel.classList.remove("is-active");
    }
    activePanel = panel;
    panel.classList.add("is-active");
  }

  function hideTooltip() {
    tooltip.classList.remove("is-visible");
    if (activePanel) {
      activePanel.classList.remove("is-active");
      activePanel = null;
    }
  }

  panels.forEach(function (panel) {
    panel.addEventListener("mouseenter", function () {
      showTooltip(panel);
    });
    panel.addEventListener("focus", function () {
      showTooltip(panel);
    });
    panel.addEventListener("mouseleave", function () {
      if (!isTouch) hideTooltip();
    });
    panel.addEventListener("blur", function () {
      hideTooltip();
    });

    if (isTouch) {
      panel.addEventListener("click", function (event) {
        // a synthetic "mouseenter" fires before "click" on tap and already
        // shows the tooltip, so activePanel can't tell first tap from
        // second — track "tapped" per panel instead.
        if (!panel.classList.contains("is-tapped")) {
          event.preventDefault();
          panels.forEach(function (p) {
            if (p !== panel) p.classList.remove("is-tapped");
          });
          panel.classList.add("is-tapped");
          showTooltip(panel);
        }
        // second tap on an already-tapped panel follows the link normally
      });
    }
  });

  document.addEventListener(
    "click",
    function (event) {
      if (isTouch && activePanel && !art.contains(event.target)) {
        panels.forEach(function (p) {
          p.classList.remove("is-tapped");
        });
        hideTooltip();
      }
    },
    true
  );

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") hideTooltip();
  });
})();

</script>
