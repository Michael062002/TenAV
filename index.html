<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TenTechnology Group</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="tenav-hero" id="hero">
    <div class="hero-art-wrap" id="heroArt">
      <div class="hero-art">
        <div class="hero-logo" style="--logo-w:1430; --logo-h:893;">
          <picture>
            <source srcset="assets/hero.webp" type="image/webp" />
            <img
              class="hero-logo-img"
              src="assets/hero.jpg"
              alt="TenTechnology Group: a Kubus Group Company"
              width="1430"
              height="893"
            />
          </picture>
          <picture>
            <source srcset="assets/tick.webp" type="image/webp" />
            <img class="hero-tick" src="assets/tick.png" alt="" aria-hidden="true" width="1430" height="893" />
          </picture>
        </div>

        <div class="hero-panels">
          <a
            class="hero-panel"
            data-id="install"
            href="#tenav"
            aria-label="TenAV — AV design, installation and integration. Explore this service."
            style="--brand:#EE2F2F"
          >
            <span class="hero-panel-bg">
              <picture>
                <source srcset="assets/photo-tenav.webp" type="image/webp" />
                <img src="assets/photo-tenav.jpg" alt="" aria-hidden="true" />
              </picture>
            </span>
            <span class="hero-panel-inner">
              <span class="hero-label">TenAV</span>
              <span class="hero-panel-desc">AV design, installation and integration for meeting rooms, offices and venues.</span>
              <span class="hero-panel-cta">Explore <span aria-hidden="true">→</span></span>
            </span>
          </a>
          <a
            class="hero-panel"
            data-id="signage"
            href="#tensignage"
            aria-label="TenSignage — digital signage and menu boards. Explore this service."
            style="--brand:#2BA6A6"
          >
            <span class="hero-panel-bg">
              <picture>
                <source srcset="assets/photo-tensignage.webp" type="image/webp" />
                <img src="assets/photo-tensignage.jpg" alt="" aria-hidden="true" />
              </picture>
            </span>
            <span class="hero-panel-inner">
              <span class="hero-label">TenSignage</span>
              <span class="hero-panel-desc">Digital signage and menu boards that keep customers informed and engaged.</span>
              <span class="hero-panel-cta">Explore <span aria-hidden="true">→</span></span>
            </span>
          </a>
          <a
            class="hero-panel"
            data-id="unify"
            href="#tenunify"
            aria-label="TenUnify — unified IT and communications. Explore this service."
            style="--brand:#B96E36"
          >
            <span class="hero-panel-bg">
              <picture>
                <source srcset="assets/photo-tenunify.webp" type="image/webp" />
                <img src="assets/photo-tenunify.jpg" alt="" aria-hidden="true" />
              </picture>
            </span>
            <span class="hero-panel-inner">
              <span class="hero-label">TenUnify</span>
              <span class="hero-panel-desc">Unified IT and communications that keep every device and workspace connected.</span>
              <span class="hero-panel-cta">Explore <span aria-hidden="true">→</span></span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
