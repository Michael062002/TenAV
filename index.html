<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TenTechnology Group</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="tenav-hero" id="hero">
    <div class="hero-content">
      <p class="hero-eyebrow">TenTechnology Group</p>
      <h1 class="hero-title">Three specialisms. One trusted technology partner.</h1>
      <p class="hero-copy">
        TenAV, TenSignage and TenUnify bring AV installation, digital signage and
        unified IT together under one roof. Explore each service below.
      </p>
      <div class="hero-ctas">
        <a class="btn btn-primary" href="/contact">Get in touch</a>
        <a class="btn btn-secondary" href="/about">About the Group</a>
      </div>
    </div>

    <div class="hero-art" id="heroArt" style="--vb-w:1166.25; --vb-h:297.75;">
      <picture>
        <source srcset="assets/hero.webp" type="image/webp" />
        <img
          class="hero-bg"
          src="assets/hero.jpg"
          alt="TenTechnology Group: a Kubus Group Company, spanning TenAV, TenSignage and TenUnify"
          width="1166"
          height="298"
        />
      </picture>

      <a
        class="hero-node"
        data-id="install"
        data-name="TenAV"
        data-description="AV design, installation and integration for meeting rooms, offices and venues."
        href="/tenav"
        aria-label="TenAV — AV design, installation and integration. Explore this service."
        style="--brand:#EE2F2F"
      ></a>
      <div class="hero-wash" data-for="install" style="--brand:#EE2F2F"></div>

      <a
        class="hero-node"
        data-id="signage"
        data-name="TenSignage"
        data-description="Digital signage and menu boards that keep customers informed and engaged."
        href="/tensignage"
        aria-label="TenSignage — digital signage and menu boards. Explore this service."
        style="--brand:#2BA6A6"
      ></a>
      <div class="hero-wash" data-for="signage" style="--brand:#2BA6A6"></div>

      <a
        class="hero-node"
        data-id="unify"
        data-name="TenUnify"
        data-description="Unified IT and communications that keep every device and workspace connected."
        href="/tenunify"
        aria-label="TenUnify — unified IT and communications. Explore this service."
        style="--brand:#B96E36"
      ></a>
      <div class="hero-wash" data-for="unify" style="--brand:#B96E36"></div>

      <div class="hero-tooltip" id="heroTooltip" role="status" aria-live="polite">
        <p class="tooltip-name" id="tooltipName"></p>
        <p class="tooltip-desc" id="tooltipDesc"></p>
        <a class="tooltip-link" id="tooltipLink" href="#">Explore <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
