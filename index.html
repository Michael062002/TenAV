<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TenTechnology Group</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="tenav-hero" id="hero">
    <div class="hero-art-wrap" id="heroArt">
      <div class="hero-art">
        <div class="hero-logo" style="--logo-w:1430; --logo-h:893;">
          <picture>
            <source srcset="assets/hero.webp" type="image/webp" />
            <img
              class="hero-logo-img"
              src="assets/hero.jpg"
              alt="TenTechnology Group: a Kubus Group Company"
              width="1430"
              height="893"
            />
          </picture>
          <picture>
            <source srcset="assets/tick.webp" type="image/webp" />
            <img class="hero-tick" src="assets/tick.png" alt="" aria-hidden="true" width="1430" height="893" />
          </picture>
        </div>

        <div class="hero-panels">
          <a
            class="hero-panel"
            data-id="install"
            data-name="TenAV"
            data-description="AV design, installation and integration for meeting rooms, offices and venues."
            href="#tenav"
            aria-label="TenAV — AV design, installation and integration. Explore this service."
            style="--brand:#EE2F2F"
          >
            <span class="hero-panel-inner"><span class="hero-label">TenAV</span></span>
          </a>
          <a
            class="hero-panel"
            data-id="signage"
            data-name="TenSignage"
            data-description="Digital signage and menu boards that keep customers informed and engaged."
            href="#tensignage"
            aria-label="TenSignage — digital signage and menu boards. Explore this service."
            style="--brand:#2BA6A6"
          >
            <span class="hero-panel-inner"><span class="hero-label">TenSignage</span></span>
          </a>
          <a
            class="hero-panel"
            data-id="unify"
            data-name="TenUnify"
            data-description="Unified IT and communications that keep every device and workspace connected."
            href="#tenunify"
            aria-label="TenUnify — unified IT and communications. Explore this service."
            style="--brand:#B96E36"
          >
            <span class="hero-panel-inner"><span class="hero-label">TenUnify</span></span>
          </a>
        </div>
      </div>

      <div class="hero-tooltip" id="heroTooltip" role="status" aria-live="polite">
        <p class="tooltip-name" id="tooltipName"></p>
        <p class="tooltip-desc" id="tooltipDesc"></p>
        <a class="tooltip-link" id="tooltipLink" href="#">Explore <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
