<style>
.tenav-kubus-card {
  /* ===================================================================
     Images live here as CSS background-image values (not <img src>).
     Defaults below are embedded base64 — nothing to upload, just paste
     this whole file into an Elementor Custom HTML widget.

     If the card still doesn't show after that, open your browser's
     DevTools Console on the live page. A line reading roughly:
       "Refused to load the image '...' because it violates the
       following Content Security Policy directive: img-src ..."
     means your host/security plugin blocks data: images at the browser
     level — no HTML change can fix that. In that case replace the three
     url("data:...") values below with real https:// URLs to images
     uploaded in your WordPress Media Library (same-origin URLs are
     always allowed by img-src) and nothing else needs to change.
     =================================================================== */
  --kb-bg-image: url("PASTE-KUBUS-BG-IMAGE-URL-HERE");
  --kb-logo-white: url("PASTE-KUBUS-LOGO-WHITE-URL-HERE");
  --kb-logo-green: url("PASTE-KUBUS-LOGO-GREEN-URL-HERE");

  --kb-brand: #9ab9ac;

  display: block;
  width: 100%;
  padding: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.tenav-kubus-card, .tenav-kubus-card *, .tenav-kubus-card *::before, .tenav-kubus-card *::after {
  box-sizing: border-box;
}

/* ---------- the card ---------- */

/* No fixed max-width/centering here on purpose — the card fills whatever
   column/section Elementor places it in instead of imposing its own boxed
   width. Height is driven by aspect-ratio (relative to the card's own
   rendered width) rather than clamp(...vw...) (relative to the whole
   viewport), so it scales correctly with the actual block size, including
   inside a narrow column on a wide page. min/max-height keep it from
   getting too short or too tall at extreme widths. */
.tenav-kubus-card .hero-card {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 2.75 / 1;
  min-height: 300px;
  max-height: 460px;
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  cursor: pointer;
  background: #11151a;
  background-clip: padding-box;
  border: 4px solid transparent;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s ease;
}

.tenav-kubus-card .hero-card:hover,
.tenav-kubus-card .hero-card:focus-visible {
  transform: translateY(-6px);
  border-color: var(--kb-brand);
  box-shadow: 0 20px 44px rgba(0,0,0,0.28), 0 0 32px -8px var(--kb-brand);
}

.tenav-kubus-card .hero-card:focus-visible {
  outline: 2px solid var(--kb-brand);
  outline-offset: 3px;
}

.tenav-kubus-card .hero-card-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image: var(--kb-bg-image);
  background-size: cover;
  background-position: center 100%;
  background-repeat: no-repeat;
  filter: saturate(0.92) contrast(1.03);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
}

.tenav-kubus-card .hero-card:hover .hero-card-bg,
.tenav-kubus-card .hero-card:focus-visible .hero-card-bg {
  transform: scale(1.05);
}

.tenav-kubus-card .hero-card-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.72) 35%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.1) 85%, rgba(0,0,0,0) 100%);
  opacity: 0.45;
  transition: opacity 0.3s ease;
}

.tenav-kubus-card .hero-card:hover .hero-card-bg::before,
.tenav-kubus-card .hero-card:focus-visible .hero-card-bg::before {
  opacity: 1;
}

.tenav-kubus-card .hero-card-content { position: absolute; inset: 0; z-index: 3; }

.tenav-kubus-card .hero-card-logo {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  width: clamp(140px, 32%, 300px);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}

.tenav-kubus-card .hero-card:hover .hero-card-logo,
.tenav-kubus-card .hero-card:focus-visible .hero-card-logo {
  transform: translate(-50%, calc(-50% - 5px));
}

/* Logo is two stacked background-image layers (white, and white-lettering
   /green-icon) cross-faded on :hover, instead of an inline <svg> or
   <img src="data:...">. Both of those are stripped by WordPress's content
   filter (wp_kses) for any account without the unfiltered_html capability,
   and a data: <img> src can also be blocked outright by a host's
   Content-Security-Policy — neither restriction reaches into a <style>
   block's own text, which is why a plain style+div test kept working
   while this widget went blank. */
.tenav-kubus-card .brand-logo-frame { position: relative; display: block; width: 100%; }
.tenav-kubus-card .brand-logo-frame::before { content: ""; display: block; padding-top: calc(728.0403481 / 2231.2964609 * 100%); }
.tenav-kubus-card .brand-logo {
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}
.tenav-kubus-card .brand-logo-white { background-image: var(--kb-logo-white); }
.tenav-kubus-card .brand-logo-green {
  background-image: var(--kb-logo-green);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.tenav-kubus-card .hero-card:hover .brand-logo-green,
.tenav-kubus-card .hero-card:focus-visible .brand-logo-green {
  opacity: 1;
}

.tenav-kubus-card .hero-card-text {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1.85rem;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  padding: 0 1.75rem;
  text-align: center;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s cubic-bezier(0.4,0,0.2,1), transform 0.2s cubic-bezier(0.4,0,0.2,1);
}

.tenav-kubus-card .hero-card:hover .hero-card-text,
.tenav-kubus-card .hero-card:focus-visible .hero-card-text {
  opacity: 1;
  transform: translateY(0);
}

.tenav-kubus-card .hero-card-desc {
  margin: 0;
  max-width: 100%;
  font-size: 0.92rem;
  line-height: 1.5;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 6px rgba(0,0,0,0.45);
}

.tenav-kubus-card .hero-card-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
}

.tenav-kubus-card .hero-card:hover .hero-card-cta,
.tenav-kubus-card .hero-card:focus-visible .hero-card-cta {
  text-decoration: underline;
  text-decoration-color: var(--kb-brand);
}

.tenav-kubus-card .hero-card-arrow {
  display: inline-block;
  color: var(--kb-brand);
  transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
}

.tenav-kubus-card .hero-card:hover .hero-card-arrow,
.tenav-kubus-card .hero-card:focus-visible .hero-card-arrow {
  transform: translateX(6px);
}

/* Touch devices have no :hover — surface the caption without it so
   mobile visitors aren't left with a plain unlabelled image tile. */
@media (hover: none) {
  .tenav-kubus-card .hero-card-text {
    opacity: 1;
    transform: translateY(0);
  }
  .tenav-kubus-card .hero-card-bg::before {
    opacity: 1;
  }
  .tenav-kubus-card .brand-logo-green {
    opacity: 1;
  }
}
</style>

<div class="tenav-kubus-card">
  <a class="hero-card" href="https://www.kubus.com/" aria-label="Kubus — The technology you need to keep your business secure, connected and running smoothly. Explore this service.">
    <span class="hero-card-bg"></span>
    <span class="hero-card-content">
      <span class="hero-card-logo">
        <span class="brand-logo-frame">
          <span class="brand-logo brand-logo-white" aria-hidden="true"></span>
          <span class="brand-logo brand-logo-green" aria-hidden="true"></span>
        </span>
      </span>
      <span class="hero-card-text">
        <span class="hero-card-desc">The technology you need to keep your business secure, connected and running smoothly.</span>
        <span class="hero-card-cta">Explore <span class="hero-card-arrow" aria-hidden="true">→</span></span>
      </span>
    </span>
  </a>
</div>
