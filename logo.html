<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TenAV Logo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  .logo-wrap {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384.68 746.54" version="1.0">
  <!-- long upstroke of the tick -->
  <path fill="#7ac29c" d="M 291.68 20.0 L 364.68 42.93 L 159.03 697.61 L 86.04 674.68 Z"/>

  <!-- short lower stroke (left leg) of the tick -->
  <path fill="#7ac29c" d="M 156.23 706.92 L 82.27 726.54 L 23.35 504.38 L 97.3 484.77 Z"/>

  <!-- small connecting bar -->
  <path fill="#17b890" d="M 20.0 468.25 L 109.03 468.25 L 109.03 507.15 L 20.0 507.15 Z"/>
</svg>
</div>
</body>
</html>
