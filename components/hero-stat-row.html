<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1ea7e0;
    --text-soft: #5b6b85;
    --bg: #ffffff;
    --divider: #e4e8ef;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
  }

  .stat-line {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: wrap;
    max-width: 68rem;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .stat {
    flex: 1 1 0;
    min-width: 140px;
    text-align: center;
    padding: 0 1.5rem;
    border-left: 1px solid var(--divider);
    transition: transform 0.25s ease;
  }

  .stat:first-child { border-left: none; }

  .stat:hover {
    transform: translateY(-4px);
  }

  .stat__value {
    position: relative;
    display: inline-block;
    padding-bottom: 8px;
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    font-weight: 600;
    color: var(--blue);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .stat__value::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 0;
    height: 2px;
    background: var(--blue);
    transform: translateX(-50%);
    transition: width 0.25s ease;
  }

  .stat:hover .stat__value::after {
    width: 32px;
  }

  .stat__label {
    margin-top: 0.35rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-soft);
    transition: color 0.25s ease;
  }

  .stat:hover .stat__label {
    color: var(--blue);
  }

  @media (max-width: 640px) {
    .stat-line {
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem 1.5rem;
    }
    .stat {
      border-left: none;
      border-top: 1px solid var(--divider);
      padding: 1.25rem 0 0;
    }
    .stat:first-child { border-top: none; padding-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stat-line { animation: none !important; opacity: 1 !important; }
    .stat { transition: none !important; }
    .stat:hover { transform: none !important; }
  }
</style>
</head>
<body>

<div class="stat-line" id="statLine">
  <div class="stat" data-target="2003" data-format="plain">
    <div class="stat__value"><span class="count">0</span></div>
    <div class="stat__label">Trading Since</div>
  </div>

  <div class="stat" data-target="4000" data-suffix="+">
    <div class="stat__value"><span class="count">0</span>+</div>
    <div class="stat__label">Projects Delivered</div>
  </div>

  <div class="stat" data-target="600" data-suffix="+">
    <div class="stat__value"><span class="count">0</span>+</div>
    <div class="stat__label">Organisations Served</div>
  </div>

  <div class="stat" data-static="UK-wide">
    <div class="stat__value">UK-wide</div>
    <div class="stat__label">Coverage</div>
  </div>
</div>

<script>
(function () {
  var stats = document.querySelectorAll('.stat');
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function format(value, plain) {
    return plain ? String(value) : value.toLocaleString();
  }

  function animateCount(el, target, plain, duration) {
    if (prefersReduced) {
      el.textContent = format(target, plain);
      return;
    }
    var startTime = null;
    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      var value = Math.floor(eased * target);
      el.textContent = format(value, plain);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = format(target, plain);
      }
    }
    requestAnimationFrame(step);
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var stat = entry.target;

      if (!stat.hasAttribute('data-static')) {
        var target = parseInt(stat.getAttribute('data-target'), 10) || 0;
        var plain = stat.getAttribute('data-format') === 'plain';
        animateCount(stat.querySelector('.count'), target, plain, 1400);
      }

      observer.unobserve(stat);
    });
  }, { threshold: 0.4 });

  stats.forEach(function (stat) { observer.observe(stat); });
})();
</script>

</body>
</html>
