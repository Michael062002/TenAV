<style>
.tenav-svgm,.tenav-svgm *,.tenav-svgm *::before,.tenav-svgm *::after{
  box-sizing:border-box;
}
.tenav-svgm{
  --navy:   #0E2530;
  --navy-2: #16303D;
  --navy-3: #12262F;
  --copper: #CC7A3E;
  --cu-lt:  #E7A874;
  --bg-lt:  #EFF5F8;
  --g:      clamp(7px,1.3vw,12px);
  --r:      clamp(11px,1.6vw,17px);
  --ease:   cubic-bezier(.22,.8,.24,1);
}
.tenav-svgm-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:var(--g);
  max-width:min(480px,100%);
  height:clamp(220px,36vw,360px);
}
.tenav-svgm-tile{
  position:relative;
  border-radius:var(--r);
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:
    transform  .35s var(--ease),
    box-shadow .35s var(--ease);
  outline:2.5px solid transparent;
  outline-offset:0;
}
.tenav-svgm-tile:focus-visible{
  outline-color:var(--copper);
  outline-offset:4px;
}
.tenav-svgm-tile:nth-child(1){grid-column:1;  grid-row:1/3;}
.tenav-svgm-tile:nth-child(2){grid-column:2/4;grid-row:1;}
.tenav-svgm-tile:nth-child(3){grid-column:2;  grid-row:2;}
.tenav-svgm-tile:nth-child(4){grid-column:3;  grid-row:2;}
.tenav-svgm-tile--dark{
  background:var(--navy);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 6px 28px rgba(4,14,19,.40);
}
.tenav-svgm-tile--light{
  background:var(--bg-lt);
  border:1px solid rgba(14,37,48,.07);
  box-shadow:0 4px 14px rgba(14,37,48,.10);
}
.tenav-svgm-tile:hover{transform:translateY(-5px) scale(1.024);}
.tenav-svgm-tile--dark:hover{
  box-shadow:0 18px 52px rgba(4,14,19,.52),0 0 0 2px var(--copper);
}
.tenav-svgm-tile--light:hover{
  box-shadow:0 12px 36px rgba(14,37,48,.18),0 0 0 2px var(--copper);
}
.tenav-svgm-tile--dark::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse 80% 55% at 50% 95%,rgba(204,122,62,.28),transparent 68%);
  opacity:0;transition:opacity .4s ease;pointer-events:none;
}
.tenav-svgm-tile--dark:hover::after{opacity:1;}
.tenav-svgm-tile.tenav-svgm--sym{
  outline-color:rgba(204,122,62,.4);
  outline-offset:4px;
}
.tenav-svgm-icon{
  display:block;
  width:clamp(68px,70%,180px);
  height:auto;
  pointer-events:none;
  transition:transform .35s var(--ease),filter .35s ease;
}
.tenav-svgm-tile--dark:hover  .tenav-svgm-icon{
  filter:drop-shadow(0 6px 18px rgba(204,122,62,.35));
  transform:scale(1.06);
}
.tenav-svgm-tile--light:hover .tenav-svgm-icon{
  filter:drop-shadow(0 4px 12px rgba(14,37,48,.22));
  transform:scale(1.06);
}
/* pin idle wave */
.tenav-svgm-pin{animation:tenavSvgmPin 2.7s ease-in-out infinite;}
@keyframes tenavSvgmPin{0%,100%{opacity:.62;}50%{opacity:1;}}
/* click cascade flash */
.tenav-svgm-tile.tenav-svgm--active::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  border:2.5px solid var(--cu-lt);pointer-events:none;z-index:3;
  animation:tenavSvgmRing .68s var(--ease) forwards;
}
@keyframes tenavSvgmRing{0%{opacity:.9;transform:scale(.96);}100%{opacity:0;transform:scale(1.07);}}
.tenav-svgm-tile.tenav-svgm--active .tenav-svgm-pin{
  animation:tenavSvgmPinBurst .55s ease-out forwards;
}
@keyframes tenavSvgmPinBurst{
  0%  {opacity:1;  filter:brightness(1)    drop-shadow(0 0 0   rgba(231,168,116,0));}
  38% {opacity:1;  filter:brightness(1.75) drop-shadow(0 0 6px rgba(231,168,116,.95));}
  100%{opacity:.68;filter:brightness(1)    drop-shadow(0 0 0   rgba(231,168,116,0));}
}
/* scroll entrance */
.tenav-svgm-js .tenav-svgm-tile{
  opacity:0;transform:translateY(26px) scale(.93);
  transition:opacity .62s var(--ease),transform .62s var(--ease),box-shadow .35s var(--ease);
}
.tenav-svgm-js .tenav-svgm-tile:nth-child(1){transition-delay:  0ms;}
.tenav-svgm-js .tenav-svgm-tile:nth-child(2){transition-delay: 90ms;}
.tenav-svgm-js .tenav-svgm-tile:nth-child(3){transition-delay:185ms;}
.tenav-svgm-js .tenav-svgm-tile:nth-child(4){transition-delay:265ms;}
.tenav-svgm-js.tenav-svgm--in .tenav-svgm-tile{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){
  .tenav-svgm *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  .tenav-svgm-js .tenav-svgm-tile{opacity:1;transform:none;}
}
</style>

<div class="tenav-svgm" role="region" aria-label="Network connector icons">
  <div class="tenav-svgm-grid" data-tenav-svgm>
    <div class="tenav-svgm-tile tenav-svgm-tile--dark"  tabindex="0" role="img" aria-label="Network connector" data-svg="1"></div>
    <div class="tenav-svgm-tile tenav-svgm-tile--light" tabindex="0" role="img" aria-label="Network connector" data-svg="1"></div>
    <div class="tenav-svgm-tile tenav-svgm-tile--light" tabindex="0" role="img" aria-label="Network connector" data-svg="1"></div>
    <div class="tenav-svgm-tile tenav-svgm-tile--dark"  tabindex="0" role="img" aria-label="Network connector" data-svg="1"></div>
  </div>
</div>

<script>
(function(){
  var grid = document.querySelector('[data-tenav-svgm]');
  if(!grid) return;

  function isolateSvgIds(svgStr, prefix){
    var ids = [];
    var re = /\bid="([^"]+)"/g, m;
    while((m = re.exec(svgStr)) !== null){ ids.push(m[1]); }
    ids.sort(function(a,b){ return b.length - a.length; });
    ids.forEach(function(id){
      var n = prefix + '-' + id;
      svgStr = svgStr.split('id="' + id + '"').join('id="' + n + '"');
      svgStr = svgStr.split('url(#' + id + ')').join('url(#' + n + ')');
      svgStr = svgStr.split('href="#' + id + '"').join('href="#' + n + '"');
      svgStr = svgStr.split('xlink:href="#' + id + '"').join('xlink:href="#' + n + '"');
    });
    return svgStr;
  }

  var tiles = grid.querySelectorAll('.tenav-svgm-tile');

  tiles.forEach(function(tile, i){
    var srcId = 'tenav-svgm-src-' + (tile.dataset.svg || '1');
    var srcEl = document.getElementById(srcId);
    if(!srcEl) return;

    var svgStr = srcEl.innerHTML.trim();
    svgStr = isolateSvgIds(svgStr, 't' + (i + 1));

    // Remove white background rects
    svgStr = svgStr.replace(/<rect[^>]*fill="#ffffff"[^>]*\/>/g, '');

    var parser = new DOMParser();
    var doc = parser.parseFromString('<svg xmlns="http://www.w3.org/2000/svg">' + svgStr + '</svg>', 'image/svg+xml');
    var newSvg = doc.querySelector('svg > svg') || doc.querySelector('svg');
    if(!newSvg) return;

    // Crop to connector only
    newSvg.setAttribute('viewBox', '265 30 285 760');
    newSvg.setAttribute('width', '100%');
    newSvg.setAttribute('height', '100%');
    newSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    newSvg.classList.add('tenav-svgm-icon');
    newSvg.removeAttribute('zoomAndPan');

    // Animate orange pins
    var pinDelay = 0;
    var pins = newSvg.querySelectorAll('path[fill="#b96e36"]');
    pins.forEach(function(pin){
      pin.classList.add('tenav-svgm-pin');
      pin.style.animationDelay = pinDelay + 'ms';
      pinDelay += 80;
    });

    tile.appendChild(document.importNode(newSvg, true));
  });

  // Scroll entrance
  var wrapper = grid.closest('.tenav-svgm');
  if(wrapper){
    wrapper.classList.add('tenav-svgm-js');
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){ wrapper.classList.add('tenav-svgm--in'); io.disconnect(); }
        });
      },{threshold:.12});
      io.observe(wrapper);
    } else {
      wrapper.classList.add('tenav-svgm--in');
    }
  }

  // Click cascade flash + sympathetic highlight
  tiles.forEach(function(tile){
    function activate(){
      var isDark = tile.classList.contains('tenav-svgm-tile--dark');
      tiles.forEach(function(t){
        var tIsDark = t.classList.contains('tenav-svgm-tile--dark');
        t.classList.remove('tenav-svgm--active','tenav-svgm--sym');
        if(t === tile){
          t.classList.add('tenav-svgm--active');
          setTimeout(function(){ t.classList.remove('tenav-svgm--active'); }, 700);
        } else if(tIsDark !== isDark){
          t.classList.add('tenav-svgm--sym');
          setTimeout(function(){ t.classList.remove('tenav-svgm--sym'); }, 700);
        }
      });
    }
    tile.addEventListener('click', activate);
    tile.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
    });
  });

})();
</script>
